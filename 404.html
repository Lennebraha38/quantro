<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0c0e">
<title>404 — Bulunamadı | Quantro</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--void:#0b0c0e;--deep:#14161a;--surface:#1c1f26;--cyan:#d4a853;--cyanM:rgba(212,168,83,.35);--cyanD:rgba(212,168,83,.12);--text:#ece7dd;--muted:#9e988c;--fd:'Newsreader',Georgia,serif;--fb:'IBM Plex Sans',sans-serif;--fm:'IBM Plex Mono',monospace}
  html,body{height:100%}
  body{background:var(--void);color:var(--text);font-family:var(--fb);display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-font-smoothing:antialiased}
  .err{text-align:center;padding:40px 24px;max-width:640px}
  .glow{font-family:var(--fd);font-size:clamp(72px,22vw,180px);font-weight:800;line-height:1;letter-spacing:-6px;background:linear-gradient(180deg,var(--cyan) 0%,#7a5c22 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 28px rgba(212,168,83,.2))}
  .ey{font-family:var(--fm);font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--cyan);margin-bottom:14px}
  .t{font-family:var(--fd);font-size:clamp(18px,4vw,26px);font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
  .d{font-size:14px;font-weight:300;color:var(--muted);line-height:1.8;margin-bottom:34px}
  .acts{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  a{font-family:var(--fm);font-size:11px;letter-spacing:2.5px;text-transform:uppercase;padding:14px 26px;text-decoration:none;transition:opacity .2s}
  a:hover{opacity:.8}
  .home{background:var(--cyan);color:var(--void);font-weight:700}
  .outline{color:var(--cyan);border:1px solid var(--cyanM)}
  .skyp{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 15% 20%,rgba(255,255,255,.5) 0%,transparent 100%),radial-gradient(1px 1px at 70% 12%,rgba(255,255,255,.4) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 85% 70%,rgba(200,220,255,.5) 0%,transparent 100%);opacity:.7}
</style>
</head>
<body>
<div class="skyp" aria-hidden="true"></div>
<div class="err" role="alert">
  <div class="ey">Quantro · Sorgu Çözümlendi</div>
  <div class="glow">404</div>
  <div class="t">Bölge haritasında değil</div>
  <div class="d">İstediğiniz sayfa gözlemlenemiyor — taşınmış, kaldırılmış veya hiç var olmamış olabilir.<br>Blog aramasıyla doğru koordinata ulaşın ya da ana sayfadan devam edin.</div>
  <div class="acts">
    <a href="index.html" class="home">← Ana Sayfa</a>
    <a href="blog.html" class="outline">Blog'da Ara</a>
    <a href="mailto:quantro38@gmail.com" class="outline">İletişim</a>
  </div>
</div>
</body>
</html>
