<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>QTR — Yönetim Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@300;400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@300;400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
<script src="admin-i18n.js" defer></script>
</head>
<body>
<div class="bg"><div class="bg-grid"></div><div class="bg-neb"></div><div class="bg-neb2"></div></div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <button id="langbtn" onclick="adminTT()" type="button" style="align-self:flex-end;background:none;cursor:pointer;font-family:var(--fm);font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--cyan);border:1px solid rgba(0,200,240,.25);padding:10px 16px;transition:background .2s,color .2s">TR</button>
    <div class="login-logo">Q<em>U</em>ANTRO</div>
    <div class="login-sub" data-admin-i18n="login.sub">Yönetim Paneli · Gizli Erişim</div>
    <div class="login-card">
      <label class="login-label" data-admin-i18n="login.code">Erişim Kodu</label>
      <div class="pw-wrap">
        <input class="login-input" id="pwd-input" type="password" placeholder="••••••••" maxlength="32"
          autocomplete="off" onkeydown="if(event.key==='Enter')tryLogin()">
        <button class="pw-eye" id="pw-eye" type="button" onclick="togglePwd()" aria-label="Şifreyi göster" data-admin-i18n-aria="login.eye">👁</button>
      </div>
      <button class="login-btn" id="login-btn" onclick="tryLogin()" data-admin-i18n="login.btn">Sisteme Gir</button>
      <div class="login-err" id="login-err"></div>
      <div class="login-attempts" id="login-attempts"></div>
    </div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="admin-panel">
  <div class="panel">
    <aside class="sidebar">
      <div class="sb-logo">Q<em>U</em>ANTRO<span>Control Center</span></div>
      <nav class="sb-nav">
        <button class="sb-item active" data-t="sec-posts" onclick="goSection('sec-posts')"><span class="sb-ic">📝</span><span class="sb-txt" data-admin-i18n="sb.posts">Yazılar</span></button>
        <button class="sb-item" data-t="sec-msgs" onclick="goSection('sec-msgs')"><span class="sb-ic">✉</span><span class="sb-txt" data-admin-i18n="sb.msgs">Mesajlar</span></button>
        <button class="sb-item" data-t="sec-coms" onclick="goSection('sec-coms')"><span class="sb-ic">💬</span><span class="sb-txt" data-admin-i18n="sb.coms">Yorumlar</span></button>
      </nav>
      <div class="sb-foot">
        <div class="sb-user"><span class="dot"></span> <span data-admin-i18n="sb.status">Sistem Aktif</span></div>
        <button class="logout-btn" onclick="logout()" data-admin-i18n="sb.logout">Çıkış Yap</button>
      </div>
    </aside>

    <main class="panel-main">
      <div class="topbar">
        <h1 data-admin-i18n="top.title">Yönetim <em>Paneli</em></h1>
        <div class="tb-date" id="tb-date"></div>
        <button id="langbtn" onclick="adminTT()" type="button" style="background:none;cursor:pointer;font-family:var(--fm);font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--cyan);border:1px solid rgba(0,200,240,.25);padding:10px 16px;transition:background .2s,color .2s">TR</button>
      </div>

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-val" id="stat-total">—</div>
          <div class="stat-lbl" data-admin-i18n="stat.total">Toplam Yazı</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="stat-pub">—</div>
          <div class="stat-lbl" data-admin-i18n="stat.pub">Yayında</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="stat-msg">—</div>
          <div class="stat-lbl" data-admin-i18n="stat.msg">Mesaj</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="stat-com">—</div>
          <div class="stat-lbl" data-admin-i18n="stat.pending">Bekleyen Yorum</div>
        </div>
      </div>

      <!-- Posts -->
      <section class="sec active" id="sec-posts">
        <div class="section-title" data-admin-i18n="sec.posts">Blog Yazıları</div>
        <input class="finput post-search" id="post-search" placeholder="🔍 Ara: başlık, slug, etiket" data-admin-i18n-ph="post.search.ph" oninput="applyPostFilter()">
        <div class="post-list" id="post-list">
          <div style="font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--muted);padding:16px 0" data-admin-i18n="loading">Yükleniyor...</div>
        </div>

        <div class="section-title" id="form-title" style="margin-top:48px" data-admin-i18n="form.new">Yeni Yazı</div>
        <div class="form-card">
          <div class="frow">
            <div class="fgroup">
              <label class="flbl" data-admin-i18n="flbl.title">Başlık</label>
              <input class="finput" id="f-title" placeholder="Yazı başlığı" data-admin-i18n-ph="ph.title">
            </div>
            <div class="fgroup">
              <label class="flbl" data-admin-i18n="flbl.slug">Slug (otomatik)</label>
              <input class="finput" id="f-slug" placeholder="yazi-basligi">
            </div>
          </div>
          <div class="frow3">
            <div class="fgroup">
              <label class="flbl" data-admin-i18n="flbl.emoji">Emoji</label>
              <input class="finput" id="f-emoji" placeholder="⚛" style="font-size:22px;text-align:center">
            </div>
            <div class="fgroup" style="grid-column:span 2">
              <label class="flbl" data-admin-i18n="flbl.tags">Etiketler (virgülle ayırın)</label>
              <input class="finput" id="f-tags" placeholder="Kuantum, Astrofizik, Higgs">
            </div>
          </div>
          <div class="fgroup">
            <label class="flbl" data-admin-i18n="flbl.summary">Özet (kart ve meta için)</label>
            <input class="finput" id="f-summary" placeholder="Yazının kısa özeti..." data-admin-i18n-ph="ph.summary">
          </div>
          <div class="fgroup">
            <label class="flbl" data-admin-i18n="flbl.content">İçerik</label>
            <div class="md-help">
              <span class="md-chip" onclick="ins('## ')">## Başlık</span>
              <span class="md-chip" onclick="ins('### ')">### Alt Başlık</span>
              <span class="md-chip" onclick="ins('**','**')">**kalın**</span>
              <span class="md-chip" onclick="ins('\n\n')">Paragraf</span>
              <span class="md-chip" onclick="ins('`','`')">kod</span>
              <span class="md-chip" onclick="togglePreview()" data-admin-i18n="md.preview">Önizle</span>
            </div>
            <textarea class="finput" id="f-content" placeholder="## Başlık&#10;&#10;İçerik buraya...&#10;&#10;### Alt Başlık&#10;&#10;**Önemli** bir şey." oninput="livePreview()"></textarea>
            <div class="preview-area" id="preview"></div>
          </div>
          <div class="form-actions">
            <button class="btn btn-p" onclick="submit(true)" data-admin-i18n="btn.publish">✓ Yayınla</button>
            <button class="btn btn-g" onclick="submit(false)" data-admin-i18n="btn.draft">Taslak Kaydet</button>
            <button class="btn btn-g" onclick="clearForm()" data-admin-i18n="btn.clear">Temizle</button>
          </div>
          <div class="fstatus" id="fstatus"></div>
        </div>
      </section>

      <!-- Messages -->
      <section class="sec" id="sec-msgs">
        <div class="section-title" data-admin-i18n="sec.msgs">İletişim Mesajları</div>
        <div class="msg-list" id="msg-list">
          <div style="font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--muted);padding:16px 0" data-admin-i18n="loading">Yükleniyor...</div>
        </div>
      </section>

      <!-- Comments -->
      <section class="sec" id="sec-coms">
        <div class="section-title" data-admin-i18n="sec.coms">Blog Yorumları</div>
        <div class="msg-list" id="com-list">
          <div style="font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--muted);padding:16px 0" data-admin-i18n="loading">Yükleniyor...</div>
        </div>
      </section>

    </main>
  </div>
</div>

<script>
/* ── GİRİŞ ── */
let loginBusy=false;

function tryLogin(){
  const val=document.getElementById('pwd-input').value;
  const err=document.getElementById('login-err');
  const att=document.getElementById('login-attempts');
  const btn=document.getElementById('login-btn');

  if(loginBusy)return;
  if(!val){err.textContent='Erişim kodu girin.';return}
  loginBusy=true;
  err.textContent='';att.textContent='';
  document.getElementById('pwd-input').disabled=true;
  btn.disabled=true;
  btn.innerHTML='<span class="spin"></span> Giriş Yapılıyor';

  fetch('/api/auth',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({password:val})
  }).then(async res=>{
    if(res.ok){
      const j=await res.json();
      sessionStorage.setItem('qtr_token',j.token);
      showPanel();
    } else if(res.status===429){
      err.textContent='Çok fazla deneme. 10 dk sonra tekrar deneyin.';
    } else {
      err.textContent='Hatalı erişim kodu.';
      att.textContent='Giriş denemeleri kaydediliyor.';
    }
  }).catch(()=>{
    err.textContent='Sunucuya ulaşılamadı.';
  }).finally(()=>{
    loginBusy=false;
    document.getElementById('pwd-input').disabled=false;
    document.getElementById('pwd-input').value='';
    document.getElementById('pwd-input').focus();
    btn.disabled=false;
    btn.innerHTML='Sisteme Gir';
  });
}

function logout(){
  sessionStorage.removeItem('qtr_token');
  location.reload();
}

function showPanel(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('admin-panel').style.display='block';
  tbDate();
  loadAll();
}

function togglePwd(){
  const i=document.getElementById('pwd-input');
  const b=document.getElementById('pw-eye');
  const show=i.type==='password';
  i.type=show?'text':'password';
  b.textContent=show?'🙈':'👁';
  i.focus();
}

function tbDate(){
  document.getElementById('tb-date').textContent=new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});
}

function goSection(id){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.sb-item').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const item=document.querySelector('.sb-item[data-t="'+id+'"]');
  if(item)item.classList.add('active');
}

// Oturum kontrolü
if(sessionStorage.getItem('qtr_token')){
  fetch('/api/blog',{headers:{'Authorization':'Bearer '+sessionStorage.getItem('qtr_token')}})
    .then(r=>{if(r.ok)showPanel();else sessionStorage.removeItem('qtr_token');})
    .catch(()=>sessionStorage.removeItem('qtr_token'));
}

document.getElementById('pwd-input').focus();
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('login-screen').style.display!=='none')tryLogin()});

/* ── DURUM / API ── */
const state={posts:[],msgs:[],comments:[],filter:''};

async function api(path,opts={}){
  const token=sessionStorage.getItem('qtr_token');
  const isGet=!opts.method||opts.method==='GET';
  const res=await fetch(path,{
    ...opts,
    headers:{
      ...(isGet?{}:{'Content-Type':'application/json'}),
      'Authorization':'Bearer '+token,
      ...(opts.headers||{})
    }
  });
  if(res.status===401){logout();return null}
  return res.ok?res.json().catch(()=>({})):null;
}

async function loadAll(){
  await Promise.all([loadPosts(),loadMessages(),loadComments()]);
}

/* ── YÜKLE / RENDER ── */
function lockList(id){
  const el=document.getElementById(id);
  if(el){el.style.pointerEvents='none';el.style.opacity='.55'}
}
function unlockList(id){
  const el=document.getElementById(id);
  if(el){el.style.pointerEvents='';el.style.opacity=''}
}

async function loadPosts(){
  const data=await api('/api/blog')||[];
  state.posts=data;
  renderPosts();
}

async function loadMessages(){
  const data=await api('/api/messages')||[];
  state.msgs=data;
  renderMessages();
}

async function loadComments(){
  const data=await api('/api/comments')||[];
  state.comments=data;
  renderComments();
}

function updateStats(){
  document.getElementById('stat-total').textContent=state.posts.length;
  document.getElementById('stat-pub').textContent=state.posts.filter(p=>p.published).length;
  document.getElementById('stat-msg').textContent=state.msgs.length;
  document.getElementById('stat-com').textContent=state.comments.filter(c=>!c.is_approved).length;
}

function rowPost(p){
  return `
    <div class="pi">
      <span class="pi-emoji">${p.cover_emoji||'⚛'}</span>
      <div class="pi-info">
        <div class="pi-title">${p.title}</div>
        <div class="pi-date">${new Date(p.created_at).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})}</div>
      </div>
      <span class="pi-status ${p.published?'pub':'draft'}">${p.published?'Yayında':'Taslak'}</span>
      <div class="pi-actions">
        <button class="act-btn" onclick="editPost('${p.id}')">Düzenle</button>
        <button class="act-btn ${p.published?'toggle-draft':'toggle-pub'}" onclick="togglePub('${p.id}',${p.published})">
          ${p.published?'Gizle':'Yayınla'}
        </button>
        <button class="act-btn del" onclick="delPost('${p.id}')">Sil</button>
      </div>
    </div>`;
}

function renderPosts(){
  const q=state.filter;
  const list=q?state.posts.filter(p=>
    p.title.toLowerCase().includes(q)||
    (p.slug||'').toLowerCase().includes(q)||
    (p.tags||[]).join(' ').toLowerCase().includes(q)
  ):state.posts;
  document.getElementById('post-list').innerHTML=list.length?
    list.map(rowPost).join('')
    :'<div style="font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--muted);padding:16px 0">'+(state.posts.length?'Sonuç bulunamadı.':'Henüz yazı yok.')+'</div>';
  updateStats();
}

function rowMsg(m){
  return `
    <div class="msg-item ${!m.is_read?'unread':''}">
      <div class="msg-header">
        <div>
          <div class="msg-from">${m.name}</div>
          <div class="msg-email">${m.email}</div>
        </div>
        <div class="msg-date">${new Date(m.created_at).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
      </div>
      <div class="msg-body">${m.message}</div>
      <div class="msg-actions">
        <button class="act-btn toggle-pub" onclick="markRead('${m.id}')">Okundu İşaretle</button>
        <button class="act-btn del" onclick="delMsg('${m.id}')">Sil</button>
      </div>
    </div>`;
}

function renderMessages(){
  document.getElementById('msg-list').innerHTML=state.msgs.length?
    state.msgs.map(rowMsg).join('')
    :'<div style="font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--muted);padding:16px 0">Henüz mesaj yok.</div>';
  updateStats();
}

function rowCom(c){
  return `
    <div class="msg-item ${!c.is_approved?'unread':''}">
      <div class="msg-header">
        <div>
          <div class="msg-from">${c.name} <span class="msg-email">· ${c.post_slug}</span>${c.parent_id?'<span class="msg-email"> · ↪ Yanıt</span>':''}</div>
        </div>
        <div class="msg-date">${new Date(c.created_at).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
      </div>
      <div class="msg-body">${c.content}</div>
      <div class="msg-actions">
        <span class="pi-status ${c.is_approved?'pub':'draft'}" style="align-self:center">${c.is_approved?'Onaylı':'Bekliyor'}</span>
        ${c.is_approved?'':`<button class="act-btn toggle-pub" onclick="approveCom('${c.id}')">Onayla</button>`}
        <button class="act-btn del" onclick="delCom('${c.id}')">Sil</button>
      </div>
    </div>`;
}

function renderComments(){
  document.getElementById('com-list').innerHTML=state.comments.length?
    state.comments.map(rowCom).join('')
    :'<div style="font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--muted);padding:16px 0">Henüz yorum yok.</div>';
  updateStats();
}

/* ── BLOG İŞLEMLERİ (optimistik) ── */
let editingId=null;

async function submit(publish){
  const title=document.getElementById('f-title').value.trim();
  const slug=document.getElementById('f-slug').value.trim();
  const emoji=document.getElementById('f-emoji').value.trim()||'⚛';
  const tags=document.getElementById('f-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const summary=document.getElementById('f-summary').value.trim();
  const content=document.getElementById('f-content').value.trim();
  const st=document.getElementById('fstatus');

  if(!title||!content){st.textContent='Başlık ve içerik zorunlu.';st.className='fstatus err';return}

  st.textContent='Kaydediliyor...';st.className='fstatus';
  const body={title,slug:slug||autoSlug(title),summary,content,cover_emoji:emoji,tags,published:publish};
  const res=await fetch(editingId?`/api/blog?id=${encodeURIComponent(editingId)}`:'/api/blog',{
    method:editingId?'PATCH':'POST',
    headers:{'Authorization':'Bearer '+sessionStorage.getItem('qtr_token'),'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });

  if(res.ok){
    if(editingId){
      const p=state.posts.find(x=>x.id===editingId);
      if(p)Object.assign(p,body);
      editingId=null;
      document.getElementById('form-title').textContent='Yeni Yazı';
    } else {
      const created=await res.json().catch(()=>null);
      if(created&&created.id)state.posts.unshift(created);
      else await loadPosts();
    }
    st.textContent=publish?'✓ Yazı yayınlandı!':'✓ Taslak kaydedildi.';
    st.className='fstatus ok';
    clearForm();renderPosts();
  } else {
    st.textContent='Hata oluştu. Slug çakışıyor olabilir.';st.className='fstatus err';
  }
}

function editPost(id){
  const p=state.posts.find(x=>x.id===id);
  if(!p)return;
  editingId=id;
  document.getElementById('form-title').textContent='Yazıyı Düzenle';
  document.getElementById('f-title').value=p.title||'';
  document.getElementById('f-slug').value=p.slug||'';
  document.getElementById('f-emoji').value=p.cover_emoji||'';
  document.getElementById('f-tags').value=(p.tags||[]).join(', ');
  document.getElementById('f-summary').value=p.summary||'';
  document.getElementById('f-content').value=p.content||'';
  document.getElementById('fstatus').textContent='Düzenleme modu — kaydettiğinde güncellenecek.';
  document.getElementById('fstatus').className='fstatus';
  document.getElementById('f-title').focus();
  document.getElementById('f-title').scrollIntoView({behavior:'smooth',block:'center'});
}

async function togglePub(id,current){
  const p=state.posts.find(x=>x.id===id);
  const prev=p?p.published:current;
  lockList('post-list');
  if(p)p.published=!current;
  renderPosts();
  const ok=await api(`/api/blog?id=${encodeURIComponent(id)}`,{method:'PATCH',body:JSON.stringify({published:!current})});
  if(!ok){if(p)p.published=prev;renderPosts();}
  unlockList('post-list');
}

async function delPost(id){
  if(!confirm('Bu yazıyı kalıcı olarak silmek istediğinize emin misiniz?'))return;
  const prev=state.posts.find(x=>x.id===id);
  lockList('post-list');
  state.posts=state.posts.filter(x=>x.id!==id);
  renderPosts();
  const ok=await api(`/api/blog?id=${encodeURIComponent(id)}`,{method:'DELETE'});
  if(!ok){
    state.posts.push(prev);
    state.posts.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    renderPosts();
  }
  unlockList('post-list');
}

async function markRead(id){
  const m=state.msgs.find(x=>x.id===id);
  const prev=m?m.is_read:false;
  lockList('msg-list');
  if(m)m.is_read=true;
  renderMessages();
  const ok=await api(`/api/messages?id=${encodeURIComponent(id)}`,{method:'PATCH',body:JSON.stringify({is_read:true})});
  if(!ok){if(m)m.is_read=prev;renderMessages();}
  unlockList('msg-list');
}

async function delMsg(id){
  if(!confirm('Bu mesajı silmek istediğinize emin misiniz?'))return;
  const prev=state.msgs.find(x=>x.id===id);
  lockList('msg-list');
  state.msgs=state.msgs.filter(x=>x.id!==id);
  renderMessages();
  const ok=await api(`/api/messages?id=${encodeURIComponent(id)}`,{method:'DELETE'});
  if(!ok){
    state.msgs.push(prev);
    state.msgs.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    renderMessages();
  }
  unlockList('msg-list');
}

async function approveCom(id){
  const c=state.comments.find(x=>x.id===id);
  const prev=c?c.is_approved:false;
  lockList('com-list');
  if(c)c.is_approved=true;
  renderComments();
  const ok=await api(`/api/comments?id=${encodeURIComponent(id)}`,{method:'PATCH',body:JSON.stringify({is_approved:true})});
  if(!ok){if(c)c.is_approved=prev;renderComments();}
  unlockList('com-list');
}

async function delCom(id){
  if(!confirm('Bu yorumu silmek istediğinize emin misiniz?'))return;
  const prev=state.comments.find(x=>x.id===id);
  lockList('com-list');
  state.comments=state.comments.filter(x=>x.id!==id);
  renderComments();
  const ok=await api(`/api/comments?id=${encodeURIComponent(id)}`,{method:'DELETE'});
  if(!ok){
    state.comments.push(prev);
    state.comments.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    renderComments();
  }
  unlockList('com-list');
}

/* ── FORM YARDIMCI ── */
function autoSlug(t){
  return t.toLowerCase()
    .replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u')
    .replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
}

document.getElementById('f-title').addEventListener('input',function(){
  document.getElementById('f-slug').value=autoSlug(this.value);
});

function applyPostFilter(){
  state.filter=document.getElementById('post-search').value.trim().toLowerCase();
  renderPosts();
}

function ins(before,after=''){
  const ta=document.getElementById('f-content');
  const s=ta.selectionStart,e=ta.selectionEnd;
  const sel=ta.value.substring(s,e);
  ta.value=ta.value.substring(0,s)+before+sel+after+ta.value.substring(e);
  ta.focus();ta.selectionStart=s+before.length;ta.selectionEnd=s+before.length+sel.length;
  livePreview();
}

let previewOpen=false;
function togglePreview(){
  previewOpen=!previewOpen;
  const p=document.getElementById('preview');
  p.style.display=previewOpen?'block':'none';
  if(previewOpen)livePreview();
}

function livePreview(){
  if(!previewOpen)return;
  document.getElementById('preview').innerHTML=mdToHtml(document.getElementById('f-content').value);
}

function mdToHtml(md){
  return md
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .split('\n\n').map(p=>p.startsWith('<')?p:`<p>${p}</p>`).join('');
}

function clearForm(){
  editingId=null;
  document.getElementById('form-title').textContent='Yeni Yazı';
  ['f-title','f-slug','f-emoji','f-tags','f-summary','f-content'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fstatus').textContent='';
  document.getElementById('preview').style.display='none';
  previewOpen=false;
}

</script>
