<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>QTR — Yönetim Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@300;400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@300;400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet"></noscript>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --void:#03060d;--deep:#0a1424;
  --cyan:#00e0ff;--violet:#7b5cff;--pink:#ff5cc8;
  --green:#00f0a0;--red:#ff4466;--gold:#f0c040;
  --text:#eef2fa;--muted:#7d93aa;
  --glass:rgba(255,255,255,.03);--line:rgba(0,224,255,.12);
  --fd:'Syne',sans-serif;--fb:'Space Grotesk',sans-serif;--fm:'JetBrains Mono',monospace;
}
html{scroll-behavior:smooth}
body{background:var(--void);color:var(--text);font-family:var(--fb);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-thumb{background:linear-gradient(var(--cyan),var(--violet))}
::selection{background:rgba(0,224,255,.25)}

/* ── BG AURORA ── */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(0,224,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,224,255,.03) 1px,transparent 1px);
  background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 75%)}
.bg-neb{position:absolute;width:640px;height:640px;top:-180px;right:-140px;
  background:radial-gradient(ellipse at 50% 50%,rgba(123,92,255,.18) 0%,transparent 70%);
  border-radius:50%;filter:blur(80px);animation:drift 14s ease-in-out infinite alternate}
.bg-neb2{position:absolute;width:520px;height:520px;bottom:-160px;left:-120px;
  background:radial-gradient(ellipse at 50% 50%,rgba(0,224,255,.12) 0%,transparent 70%);
  border-radius:50%;filter:blur(80px);animation:drift2 18s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-60px,40px)}}
@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(50px,-30px)}}

/* ── LOGIN ── */
#login-screen{
  position:fixed;inset:0;z-index:50;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 40%,#071325 0%,var(--void) 70%);
}
.login-box{width:100%;max-width:420px;padding:0 24px;display:flex;flex-direction:column;align-items:center;animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.login-logo{font-family:var(--fd);font-size:26px;font-weight:800;letter-spacing:8px;text-transform:uppercase;margin-bottom:10px;
  background:linear-gradient(120deg,#fff,var(--cyan) 40%,var(--violet));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.login-logo em{font-style:normal;-webkit-text-fill-color:var(--cyan);filter:drop-shadow(0 0 14px rgba(0,224,255,.6))}
.login-sub{font-family:var(--fm);font-size:9px;letter-spacing:5px;text-transform:uppercase;color:var(--muted);margin-bottom:44px}
.login-card{width:100%;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);padding:36px 32px;position:relative;border-radius:4px}
.login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--cyan),var(--violet),transparent)}
.login-label{font-family:var(--fm);font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:block}
.pw-wrap{position:relative;margin-bottom:18px}
.login-input{width:100%;background:rgba(3,6,13,.7);border:1px solid var(--line);color:var(--text);
  font-family:var(--fm);font-size:16px;padding:16px 52px 16px 20px;letter-spacing:4px;text-align:center;
  transition:border-color .25s,box-shadow .25s;border-radius:2px}
.login-input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,224,255,.08),0 0 24px rgba(0,224,255,.12)}
.pw-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);
  font-size:16px;cursor:pointer;padding:8px;transition:color .2s}
.pw-eye:hover{color:var(--cyan)}
.login-btn{width:100%;font-family:var(--fm);font-size:11px;letter-spacing:3px;text-transform:uppercase;
  background:linear-gradient(90deg,var(--cyan),var(--violet));color:#02040a;border:none;padding:16px;cursor:pointer;font-weight:700;
  border-radius:2px;transition:opacity .2s,transform .15s,box-shadow .25s;
  display:flex;align-items:center;justify-content:center;gap:10px}
.login-btn:hover{opacity:.9;box-shadow:0 6px 30px rgba(0,224,255,.25)}
.login-btn:active{transform:translateY(1px)}
.login-btn:disabled{opacity:.6;cursor:wait}
.login-err{font-family:var(--fm);font-size:10px;letter-spacing:1px;color:var(--red);margin-top:14px;min-height:16px;text-align:center}
.login-attempts{font-family:var(--fm);font-size:9px;letter-spacing:2px;color:rgba(255,68,102,.5);margin-top:6px;text-align:center}
.spin{width:12px;height:12px;border:2px solid rgba(2,4,10,.4);border-top-color:#02040a;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── PANEL LAYOUT ── */
#admin-panel{display:none;position:relative;z-index:1;min-height:100vh}
.panel{display:flex;min-height:100vh}

/* sidebar */
.sidebar{width:230px;flex-shrink:0;background:rgba(7,16,30,.6);border-right:1px solid var(--line);
  padding:28px 20px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;backdrop-filter:blur(12px)}
.sb-logo{font-family:var(--fd);font-size:15px;font-weight:800;letter-spacing:4px;text-transform:uppercase;margin-bottom:36px;padding:0 6px}
.sb-logo em{font-style:normal;color:var(--cyan);filter:drop-shadow(0 0 10px rgba(0,224,255,.7))}
.sb-logo span{font-family:var(--fm);font-size:8px;letter-spacing:3px;color:var(--muted);display:block;margin-top:4px;text-transform:uppercase}
.sb-nav{display:flex;flex-direction:column;gap:4px;flex:1}
.sb-item{display:flex;align-items:center;gap:12px;font-family:var(--fm);font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:var(--muted);background:none;border:1px solid transparent;border-left:2px solid transparent;
  padding:13px 14px;cursor:pointer;transition:all .25s;text-align:left;border-radius:2px}
.sb-item:hover{color:var(--text);background:rgba(0,224,255,.04)}
.sb-item.active{color:var(--cyan);background:linear-gradient(90deg,rgba(0,224,255,.12),transparent);border-color:var(--line);border-left-color:var(--cyan)}
.sb-item .sb-ic{font-size:14px;width:20px;text-align:center;filter:grayscale(.3)}
.sb-item.active .sb-ic{filter:none}
.sb-foot{border-top:1px solid var(--line);padding-top:16px}
.sb-user{font-family:var(--fm);font-size:9px;letter-spacing:1px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px;padding:0 6px}
.sb-user .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.logout-btn{width:100%;font-family:var(--fm);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);
  background:none;border:1px solid rgba(125,147,170,.15);padding:11px;cursor:pointer;transition:all .25s;border-radius:2px}
.logout-btn:hover{color:var(--red);border-color:rgba(255,68,102,.35);background:rgba(255,68,102,.05)}

/* main */
.panel-main{flex:1;padding:40px 44px 80px;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:36px;gap:16px;flex-wrap:wrap}
.topbar h1{font-family:var(--fd);font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:1px}
.topbar h1 em{font-style:normal;color:var(--cyan)}
.topbar .tb-date{font-family:var(--fm);font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}

/* stats */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:44px}
.stat-card{background:var(--glass);border:1px solid var(--line);padding:22px;position:relative;overflow:hidden;border-radius:4px;
  transition:transform .25s,border-color .25s;backdrop-filter:blur(8px)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--sc,var(--cyan)),transparent)}
.stat-card:hover{transform:translateY(-3px);border-color:rgba(0,224,255,.35)}
.stat-val{font-family:var(--fd);font-size:30px;font-weight:800;line-height:1;margin-bottom:8px}
.stat-lbl{font-family:var(--fm);font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.stat-card:nth-child(1){--sc:var(--cyan)}
.stat-card:nth-child(1) .stat-val{color:var(--cyan)}
.stat-card:nth-child(2){--sc:var(--green)}
.stat-card:nth-child(2) .stat-val{color:var(--green)}
.stat-card:nth-child(3){--sc:var(--gold)}
.stat-card:nth-child(3) .stat-val{color:var(--gold)}
.stat-card:nth-child(4){--sc:var(--pink)}
.stat-card:nth-child(4) .stat-val{color:var(--pink)}

/* sections */
.sec{display:none;animation:fadeIn .35s ease both}
.sec.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.section-title{font-family:var(--fm);font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--cyan);
  margin-bottom:18px;display:flex;align-items:center;gap:12px}
.section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(0,224,255,.2),transparent)}
.post-search{max-width:360px;margin-bottom:16px;font-size:13px}

/* post list */
.post-list{margin-bottom:44px}
.pi{display:flex;align-items:center;gap:16px;padding:16px 20px;background:var(--glass);border:1px solid var(--line);
  border-left:2px solid transparent;margin-bottom:6px;transition:all .25s;border-radius:4px}
.pi:hover{transform:translateX(4px);border-left-color:var(--cyan);background:rgba(0,224,255,.03)}
.pi-emoji{font-size:20px;flex-shrink:0;width:42px;height:42px;display:flex;align-items:center;justify-content:center;
  background:rgba(0,224,255,.06);border:1px solid var(--line);border-radius:4px}
.pi-info{flex:1;min-width:0}
.pi-title{font-family:var(--fd);font-size:13px;font-weight:700;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi-date{font-family:var(--fm);font-size:9px;letter-spacing:2px;color:var(--muted);margin-top:4px}
.pi-status{font-family:var(--fm);font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:5px 12px;border:1px solid;flex-shrink:0;border-radius:20px;font-weight:700}
.pi-status.pub{color:var(--green);border-color:rgba(0,240,160,.35);background:rgba(0,240,160,.06);box-shadow:0 0 12px rgba(0,240,160,.08)}
.pi-status.draft{color:var(--muted);border-color:rgba(125,147,170,.25);background:rgba(125,147,170,.05)}
.pi-actions{display:flex;gap:6px;flex-shrink:0}
.act-btn{font-family:var(--fm);font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:7px 12px;border:1px solid;background:none;cursor:pointer;transition:all .2s;border-radius:2px}
.act-btn.toggle-pub{color:var(--gold);border-color:rgba(240,192,64,.3)}
.act-btn.toggle-pub:hover{background:rgba(240,192,64,.1);box-shadow:0 0 12px rgba(240,192,64,.15)}
.act-btn.toggle-draft{color:var(--muted);border-color:rgba(125,147,170,.25)}
.act-btn.toggle-draft:hover{background:rgba(125,147,170,.1)}
.act-btn.del{color:var(--red);border-color:rgba(255,68,102,.3)}
.act-btn.del:hover{background:rgba(255,68,102,.1);box-shadow:0 0 12px rgba(255,68,102,.15)}

/* form */
.form-card{background:var(--glass);border:1px solid var(--line);padding:32px;position:relative;overflow:hidden;border-radius:4px;
  backdrop-filter:blur(10px);margin-bottom:44px}
.form-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--cyan),var(--violet),transparent)}
.fgroup{margin-bottom:18px}
.flbl{font-family:var(--fm);font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:8px}
.finput{width:100%;background:rgba(3,6,13,.7);border:1px solid var(--line);color:var(--text);font-family:var(--fb);font-size:14px;
  padding:12px 15px;transition:all .25s;border-radius:2px}
.finput:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,224,255,.07)}
textarea.finput{min-height:220px;resize:vertical;font-family:var(--fm);font-size:12px;line-height:1.8}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.form-actions{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}
.btn{font-family:var(--fm);font-size:10px;letter-spacing:2px;text-transform:uppercase;border:none;cursor:pointer;padding:13px 24px;transition:all .2s;border-radius:2px}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn-p{background:linear-gradient(90deg,var(--cyan),var(--violet));color:#02040a;font-weight:700;box-shadow:0 4px 20px rgba(0,224,255,.2)}
.btn-p:hover{box-shadow:0 6px 28px rgba(0,224,255,.35)}
.btn-g{background:transparent;color:var(--text);border:1px solid rgba(125,147,170,.2)}
.btn-g:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 14px rgba(0,224,255,.1)}
.fstatus{font-family:var(--fm);font-size:11px;letter-spacing:1px;margin-top:12px;min-height:16px}
.fstatus.ok{color:var(--green)}
.fstatus.err{color:var(--red)}

/* markdown */
.md-help{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.md-chip{font-family:var(--fm);font-size:9px;letter-spacing:1px;color:var(--muted);border:1px solid rgba(0,224,255,.1);padding:4px 10px;cursor:pointer;transition:all .2s;border-radius:2px}
.md-chip:hover{color:var(--cyan);border-color:rgba(0,224,255,.3);box-shadow:0 0 10px rgba(0,224,255,.1)}
.preview-area{background:rgba(3,6,13,.7);border:1px solid rgba(0,224,255,.1);padding:22px;margin-top:14px;display:none;min-height:100px;
  font-size:14px;line-height:1.8;color:rgba(238,242,250,.75);border-radius:4px}
.preview-area h2{font-family:var(--fd);font-size:22px;font-weight:800;text-transform:uppercase;color:var(--text);margin:24px 0 10px}
.preview-area h3{font-family:var(--fd);font-size:16px;font-weight:700;color:var(--text);margin:18px 0 8px}
.preview-area strong{color:var(--cyan)}
.preview-area code{font-family:var(--fm);font-size:14px;color:var(--cyan);background:rgba(0,224,255,.07);padding:10px 16px;display:block;margin:12px 0;border-left:2px solid var(--cyan)}

/* messages / comments */
.msg-list{margin-bottom:44px}
.msg-item{padding:18px 20px;background:var(--glass);border:1px solid var(--line);border-left:2px solid transparent;
  margin-bottom:6px;transition:all .25s;border-radius:4px}
.msg-item:hover{border-left-color:var(--cyan);background:rgba(0,224,255,.02)}
.msg-item.unread{border-left-color:var(--cyan);background:linear-gradient(90deg,rgba(0,224,255,.05),transparent)}
.msg-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:12px;flex-wrap:wrap}
.msg-from{font-family:var(--fd);font-size:13px;font-weight:700;text-transform:uppercase}
.msg-email{font-family:var(--fm);font-size:10px;color:var(--cyan);letter-spacing:1px;opacity:.8}
.msg-date{font-family:var(--fm);font-size:9px;letter-spacing:2px;color:var(--muted)}
.msg-body{font-size:13px;color:rgba(238,242,250,.55);line-height:1.7}
.msg-actions{margin-top:12px;display:flex;gap:8px}

/* responsive */
@media(max-width:960px){
  .panel{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;gap:14px;
    padding:16px 20px;border-right:none;border-bottom:1px solid var(--line)}
  .sb-logo{margin-bottom:0;margin-right:6px}
  .sb-logo span{display:none}
  .sb-nav{flex-direction:row;flex:1}
  .sb-foot{border-top:none;padding-top:0;margin-left:auto}
  .sb-user{display:none}
  .logout-btn{width:auto}
  .panel-main{padding:28px 20px 60px}
  .stats-row{grid-template-columns:1fr 1fr}
  .frow,.frow3{grid-template-columns:1fr}
  .pi{flex-wrap:wrap}
  .pi-actions{width:100%}
  .sb-item{font-size:9px;padding:10px}
}
@media(max-width:520px){
  .stats-row{grid-template-columns:1fr}
  .sb-item .sb-txt{display:none}
}

</style>
</head>
<body>
<div class="bg"><div class="bg-grid"></div><div class="bg-neb"></div><div class="bg-neb2"></div></div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">Q<em>U</em>ANTRO</div>
    <div class="login-sub">Yönetim Paneli · Gizli Erişim</div>
    <div class="login-card">
      <label class="login-label">Erişim Kodu</label>
      <div class="pw-wrap">
        <input class="login-input" id="pwd-input" type="password" placeholder="••••••••" maxlength="32"
          autocomplete="off" onkeydown="if(event.key==='Enter')tryLogin()">
        <button class="pw-eye" id="pw-eye" type="button" onclick="togglePwd()" aria-label="Şifreyi göster">👁</button>
      </div>
      <button class="login-btn" id="login-btn" onclick="tryLogin()">Sisteme Gir</button>
      <div class="login-err" id="login-err"></div>
      <div class="login-attempts" id="login-attempts"></div>
    </div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="admin-panel">
  <div class="panel">
    <aside class="sidebar">
      <div class="sb-logo">Q<em>U</em>ANTRO<span>Control Center</span></div>
      <nav class="sb-nav">
        <button class="sb-item active" data-t="sec-posts" onclick="goSection('sec-posts')"><span class="sb-ic">📝</span><span class="sb-txt">Yazılar</span></button>
        <button class="sb-item" data-t="sec-msgs" onclick="goSection('sec-msgs')"><span class="sb-ic">✉</span><span class="sb-txt">Mesajlar</span></button>
        <button class="sb-item" data-t="sec-coms" onclick="goSection('sec-coms')"><span class="sb-ic">💬</span><span class="sb-txt">Yorumlar</span></button>
      </nav>
      <div class="sb-foot">
        <div class="sb-user"><span class="dot"></span> Sistem Aktif</div>
        <button class="logout-btn" onclick="logout()">Çıkış Yap</button>
      </div>
    </aside>

    <main class="panel-main">
      <div class="topbar">
        <h1>Yönetim <em>Paneli</em></h1>
        <div class="tb-date" id="tb-date"></div>
      </div>

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-val" id="stat-total">—</div>
          <div class="stat-lbl">Toplam Yazı</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="stat-pub">—</div>
          <div class="stat-lbl">Yayında</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="stat-msg">—</div>
          <div class="stat-lbl">Mesaj</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="stat-com">—</div>
          <div class="stat-lbl">Bekleyen Yorum</div>
        </div>
      </div>

      <!-- Posts -->
      <section class="sec active" id="sec-posts">
        <div class="section-title">Blog Yazıları</div>
        <input class="finput post-search" id="post-search" placeholder="🔍 Ara: başlık, slug, etiket" oninput="applyPostFilter()">
        <div class="post-list" id="post-list">
          <div style="font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--muted);padding:16px 0">Yükleniyor...</div>
        </div>

        <div class="section-title" id="form-title" style="margin-top:48px">Yeni Yazı</div>
        <div class="form-card">
          <div class="frow">
            <div class="fgroup">
              <label class="flbl">Başlık</label>
              <input class="finput" id="f-title" placeholder="Yazı başlığı">
            </div>
            <div class="fgroup">
              <label class="flbl">Slug (otomatik)</label>
              <input class="finput" id="f-slug" placeholder="yazi-basligi">
            </div>
          </div>
          <div class="frow3">
            <div class="fgroup">
              <label class="flbl">Emoji</label>
              <input class="finput" id="f-emoji" placeholder="⚛" style="font-size:22px;text-align:center">
            </div>
            <div class="fgroup" style="grid-column:span 2">
              <label class="flbl">Etiketler (virgülle ayırın)</label>
              <input class="finput" id="f-tags" placeholder="Kuantum, Astrofizik, Higgs">
            </div>
          </div>
          <div class="fgroup">
            <label class="flbl">Özet (kart ve meta için)</label>
            <input class="finput" id="f-summary" placeholder="Yazının kısa özeti...">
          </div>
          <div class="fgroup">
            <label class="flbl">İçerik</label>
            <div class="md-help">
              <span class="md-chip" onclick="ins('## ')">## Başlık</span>
              <span class="md-chip" onclick="ins('### ')">### Alt Başlık</span>
              <span class="md-chip" onclick="ins('**','**')">**kalın**</span>
              <span class="md-chip" onclick="ins('\n\n')">Paragraf</span>
              <span class="md-chip" onclick="ins('`','`')">kod</span>
              <span class="md-chip" onclick="togglePreview()">Önizle</span>
            </div>
            <textarea class="finput" id="f-content" placeholder="## Başlık&#10;&#10;İçerik buraya...&#10;&#10;### Alt Başlık&#10;&#10;**Önemli** bir şey." oninput="livePreview()"></textarea>
            <div class="preview-area" id="preview"></div>
          </div>
          <div class="form-actions">
            <button class="btn btn-p" onclick="submit(true)">✓ Yayınla</button>
            <button class="btn btn-g" onclick="submit(false)">Taslak Kaydet</button>
            <button class="btn btn-g" onclick="clearForm()">Temizle</button>
          </div>
          <div class="fstatus" id="fstatus"></div>
        </div>
      </section>

      <!-- Messages -->
      <section class="sec" id="sec-msgs">
        <div class="section-title">İletişim Mesajları</div>
        <div class="msg-list" id="msg-list">
          <div style="font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--muted);padding:16px 0">Yükleniyor...</div>
        </div>
      </section>

      <!-- Comments -->
      <section class="sec" id="sec-coms">
        <div class="section-title">Blog Yorumları</div>
        <div class="msg-list" id="com-list">
          <div style="font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--muted);padding:16px 0">Yükleniyor...</div>
        </div>
      </section>

    </main>
  </div>
</div>

<script>
/* ── GİRİŞ ── */
let loginBusy=false;

function tryLogin(){
  const val=document.getElementById('pwd-input').value;
  const err=document.getElementById('login-err');
  const att=document.getElementById('login-attempts');
  const btn=document.getElementById('login-btn');

  if(loginBusy)return;
  if(!val){err.textContent='Erişim kodu girin.';return}
  loginBusy=true;
  err.textContent='';att.textContent='';
  document.getElementById('pwd-input').disabled=true;
  btn.disabled=true;
  btn.innerHTML='<span class="spin"></span> Giriş Yapılıyor';

  fetch('/api/auth',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({password:val})
  }).then(async res=>{
    if(res.ok){
      const j=await res.json();
      sessionStorage.setItem('qtr_token',j.token);
      showPanel();
    } else if(res.status===429){
      err.textContent='Çok fazla deneme. 10 dk sonra tekrar deneyin.';
    } else {
      err.textContent='Hatalı erişim kodu.';
      att.textContent='Giriş denemeleri kaydediliyor.';
    }
  }).catch(()=>{
    err.textContent='Sunucuya ulaşılamadı.';
  }).finally(()=>{
    loginBusy=false;
    document.getElementById('pwd-input').disabled=false;
    document.getElementById('pwd-input').value='';
    document.getElementById('pwd-input').focus();
    btn.disabled=false;
    btn.innerHTML='Sisteme Gir';
  });
}

function logout(){
  sessionStorage.removeItem('qtr_token');
  location.reload();
}

function showPanel(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('admin-panel').style.display='block';
  tbDate();
  loadAll();
}

function togglePwd(){
  const i=document.getElementById('pwd-input');
  const b=document.getElementById('pw-eye');
  const show=i.type==='password';
  i.type=show?'text':'password';
  b.textContent=show?'🙈':'👁';
  i.focus();
}

function tbDate(){
  document.getElementById('tb-date').textContent=new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});
}

function goSection(id){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.sb-item').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const item=document.querySelector('.sb-item[data-t="'+id+'"]');
  if(item)item.classList.add('active');
}

// Oturum kontrolü
if(sessionStorage.getItem('qtr_token')){
  fetch('/api/blog',{headers:{'Authorization':'Bearer '+sessionStorage.getItem('qtr_token')}})
    .then(r=>{if(r.ok)showPanel();else sessionStorage.removeItem('qtr_token');})
    .catch(()=>sessionStorage.removeItem('qtr_token'));
}

document.getElementById('pwd-input').focus();
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('login-screen').style.display!=='none')tryLogin()});

/* ── DURUM / API ── */
const state={posts:[],msgs:[],comments:[],filter:''};

async function api(path,opts={}){
  const token=sessionStorage.getItem('qtr_token');
  const isGet=!opts.method||opts.method==='GET';
  const res=await fetch(path,{
    ...opts,
    headers:{
      ...(isGet?{}:{'Content-Type':'application/json'}),
      'Authorization':'Bearer '+token,
      ...(opts.headers||{})
    }
  });
  if(res.status===401){logout();return null}
  return res.ok?res.json().catch(()=>({})):null;
}

async function loadAll(){
  await Promise.all([loadPosts(),loadMessages(),loadComments()]);
}

/* ── YÜKLE / RENDER ── */
function lockList(id){
  const el=document.getElementById(id);
  if(el){el.style.pointerEvents='none';el.style.opacity='.55'}
}
function unlockList(id){
  const el=document.getElementById(id);
  if(el){el.style.pointerEvents='';el.style.opacity=''}
}

async function loadPosts(){
  const data=await api('/api/blog')||[];
  state.posts=data;
  renderPosts();
}

async function loadMessages(){
  const data=await api('/api/messages')||[];
  state.msgs=data;
  renderMessages();
}

async function loadComments(){
  const data=await api('/api/comments')||[];
  state.comments=data;
  renderComments();
}

function updateStats(){
  document.getElementById('stat-total').textContent=state.posts.length;
  document.getElementById('stat-pub').textContent=state.posts.filter(p=>p.published).length;
  document.getElementById('stat-msg').textContent=state.msgs.length;
  document.getElementById('stat-com').textContent=state.comments.filter(c=>!c.is_approved).length;
}

function rowPost(p){
  return `
    <div class="pi">
      <span class="pi-emoji">${p.cover_emoji||'⚛'}</span>
      <div class="pi-info">
        <div class="pi-title">${p.title}</div>
        <div class="pi-date">${new Date(p.created_at).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})}</div>
      </div>
      <span class="pi-status ${p.published?'pub':'draft'}">${p.published?'Yayında':'Taslak'}</span>
      <div class="pi-actions">
        <button class="act-btn" onclick="editPost('${p.id}')">Düzenle</button>
        <button class="act-btn ${p.published?'toggle-draft':'toggle-pub'}" onclick="togglePub('${p.id}',${p.published})">
          ${p.published?'Gizle':'Yayınla'}
        </button>
        <button class="act-btn del" onclick="delPost('${p.id}')">Sil</button>
      </div>
    </div>`;
}

function renderPosts(){
  const q=state.filter;
  const list=q?state.posts.filter(p=>
    p.title.toLowerCase().includes(q)||
    (p.slug||'').toLowerCase().includes(q)||
    (p.tags||[]).join(' ').toLowerCase().includes(q)
  ):state.posts;
  document.getElementById('post-list').innerHTML=list.length?
    list.map(rowPost).join('')
    :'<div style="font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--muted);padding:16px 0">'+(state.posts.length?'Sonuç bulunamadı.':'Henüz yazı yok.')+'</div>';
  updateStats();
}

function rowMsg(m){
  return `
    <div class="msg-item ${!m.is_read?'unread':''}">
      <div class="msg-header">
        <div>
          <div class="msg-from">${m.name}</div>
          <div class="msg-email">${m.email}</div>
        </div>
        <div class="msg-date">${new Date(m.created_at).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
      </div>
      <div class="msg-body">${m.message}</div>
      <div class="msg-actions">
        <button class="act-btn toggle-pub" onclick="markRead('${m.id}')">Okundu İşaretle</button>
        <button class="act-btn del" onclick="delMsg('${m.id}')">Sil</button>
      </div>
    </div>`;
}

function renderMessages(){
  document.getElementById('msg-list').innerHTML=state.msgs.length?
    state.msgs.map(rowMsg).join('')
    :'<div style="font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--muted);padding:16px 0">Henüz mesaj yok.</div>';
  updateStats();
}

function rowCom(c){
  return `
    <div class="msg-item ${!c.is_approved?'unread':''}">
      <div class="msg-header">
        <div>
          <div class="msg-from">${c.name} <span class="msg-email">· ${c.post_slug}</span>${c.parent_id?'<span class="msg-email"> · ↪ Yanıt</span>':''}</div>
        </div>
        <div class="msg-date">${new Date(c.created_at).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
      </div>
      <div class="msg-body">${c.content}</div>
      <div class="msg-actions">
        <span class="pi-status ${c.is_approved?'pub':'draft'}" style="align-self:center">${c.is_approved?'Onaylı':'Bekliyor'}</span>
        ${c.is_approved?'':`<button class="act-btn toggle-pub" onclick="approveCom('${c.id}')">Onayla</button>`}
        <button class="act-btn del" onclick="delCom('${c.id}')">Sil</button>
      </div>
    </div>`;
}

function renderComments(){
  document.getElementById('com-list').innerHTML=state.comments.length?
    state.comments.map(rowCom).join('')
    :'<div style="font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--muted);padding:16px 0">Henüz yorum yok.</div>';
  updateStats();
}

/* ── BLOG İŞLEMLERİ (optimistik) ── */
let editingId=null;

async function submit(publish){
  const title=document.getElementById('f-title').value.trim();
  const slug=document.getElementById('f-slug').value.trim();
  const emoji=document.getElementById('f-emoji').value.trim()||'⚛';
  const tags=document.getElementById('f-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const summary=document.getElementById('f-summary').value.trim();
  const content=document.getElementById('f-content').value.trim();
  const st=document.getElementById('fstatus');

  if(!title||!content){st.textContent='Başlık ve içerik zorunlu.';st.className='fstatus err';return}

  st.textContent='Kaydediliyor...';st.className='fstatus';
  const body={title,slug:slug||autoSlug(title),summary,content,cover_emoji:emoji,tags,published:publish};
  const res=await fetch(editingId?`/api/blog?id=${encodeURIComponent(editingId)}`:'/api/blog',{
    method:editingId?'PATCH':'POST',
    headers:{'Authorization':'Bearer '+sessionStorage.getItem('qtr_token'),'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });

  if(res.ok){
    if(editingId){
      const p=state.posts.find(x=>x.id===editingId);
      if(p)Object.assign(p,body);
      editingId=null;
      document.getElementById('form-title').textContent='Yeni Yazı';
    } else {
      const created=await res.json().catch(()=>null);
      if(created&&created.id)state.posts.unshift(created);
      else await loadPosts();
    }
    st.textContent=publish?'✓ Yazı yayınlandı!':'✓ Taslak kaydedildi.';
    st.className='fstatus ok';
    clearForm();renderPosts();
  } else {
    st.textContent='Hata oluştu. Slug çakışıyor olabilir.';st.className='fstatus err';
  }
}

function editPost(id){
  const p=state.posts.find(x=>x.id===id);
  if(!p)return;
  editingId=id;
  document.getElementById('form-title').textContent='Yazıyı Düzenle';
  document.getElementById('f-title').value=p.title||'';
  document.getElementById('f-slug').value=p.slug||'';
  document.getElementById('f-emoji').value=p.cover_emoji||'';
  document.getElementById('f-tags').value=(p.tags||[]).join(', ');
  document.getElementById('f-summary').value=p.summary||'';
  document.getElementById('f-content').value=p.content||'';
  document.getElementById('fstatus').textContent='Düzenleme modu — kaydettiğinde güncellenecek.';
  document.getElementById('fstatus').className='fstatus';
  document.getElementById('f-title').focus();
  document.getElementById('f-title').scrollIntoView({behavior:'smooth',block:'center'});
}

async function togglePub(id,current){
  const p=state.posts.find(x=>x.id===id);
  const prev=p?p.published:current;
  lockList('post-list');
  if(p)p.published=!current;
  renderPosts();
  const ok=await api(`/api/blog?id=${encodeURIComponent(id)}`,{method:'PATCH',body:JSON.stringify({published:!current})});
  if(!ok){if(p)p.published=prev;renderPosts();}
  unlockList('post-list');
}

async function delPost(id){
  if(!confirm('Bu yazıyı kalıcı olarak silmek istediğinize emin misiniz?'))return;
  const prev=state.posts.find(x=>x.id===id);
  lockList('post-list');
  state.posts=state.posts.filter(x=>x.id!==id);
  renderPosts();
  const ok=await api(`/api/blog?id=${encodeURIComponent(id)}`,{method:'DELETE'});
  if(!ok){
    state.posts.push(prev);
    state.posts.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    renderPosts();
  }
  unlockList('post-list');
}

async function markRead(id){
  const m=state.msgs.find(x=>x.id===id);
  const prev=m?m.is_read:false;
  lockList('msg-list');
  if(m)m.is_read=true;
  renderMessages();
  const ok=await api(`/api/messages?id=${encodeURIComponent(id)}`,{method:'PATCH',body:JSON.stringify({is_read:true})});
  if(!ok){if(m)m.is_read=prev;renderMessages();}
  unlockList('msg-list');
}

async function delMsg(id){
  if(!confirm('Bu mesajı silmek istediğinize emin misiniz?'))return;
  const prev=state.msgs.find(x=>x.id===id);
  lockList('msg-list');
  state.msgs=state.msgs.filter(x=>x.id!==id);
  renderMessages();
  const ok=await api(`/api/messages?id=${encodeURIComponent(id)}`,{method:'DELETE'});
  if(!ok){
    state.msgs.push(prev);
    state.msgs.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    renderMessages();
  }
  unlockList('msg-list');
}

async function approveCom(id){
  const c=state.comments.find(x=>x.id===id);
  const prev=c?c.is_approved:false;
  lockList('com-list');
  if(c)c.is_approved=true;
  renderComments();
  const ok=await api(`/api/comments?id=${encodeURIComponent(id)}`,{method:'PATCH',body:JSON.stringify({is_approved:true})});
  if(!ok){if(c)c.is_approved=prev;renderComments();}
  unlockList('com-list');
}

async function delCom(id){
  if(!confirm('Bu yorumu silmek istediğinize emin misiniz?'))return;
  const prev=state.comments.find(x=>x.id===id);
  lockList('com-list');
  state.comments=state.comments.filter(x=>x.id!==id);
  renderComments();
  const ok=await api(`/api/comments?id=${encodeURIComponent(id)}`,{method:'DELETE'});
  if(!ok){
    state.comments.push(prev);
    state.comments.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    renderComments();
  }
  unlockList('com-list');
}

/* ── FORM YARDIMCI ── */
function autoSlug(t){
  return t.toLowerCase()
    .replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u')
    .replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
}

document.getElementById('f-title').addEventListener('input',function(){
  document.getElementById('f-slug').value=autoSlug(this.value);
});

function applyPostFilter(){
  state.filter=document.getElementById('post-search').value.trim().toLowerCase();
  renderPosts();
}

function ins(before,after=''){
  const ta=document.getElementById('f-content');
  const s=ta.selectionStart,e=ta.selectionEnd;
  const sel=ta.value.substring(s,e);
  ta.value=ta.value.substring(0,s)+before+sel+after+ta.value.substring(e);
  ta.focus();ta.selectionStart=s+before.length;ta.selectionEnd=s+before.length+sel.length;
  livePreview();
}

let previewOpen=false;
function togglePreview(){
  previewOpen=!previewOpen;
  const p=document.getElementById('preview');
  p.style.display=previewOpen?'block':'none';
  if(previewOpen)livePreview();
}

function livePreview(){
  if(!previewOpen)return;
  document.getElementById('preview').innerHTML=mdToHtml(document.getElementById('f-content').value);
}

function mdToHtml(md){
  return md
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .split('\n\n').map(p=>p.startsWith('<')?p:`<p>${p}</p>`).join('');
}

function clearForm(){
  editingId=null;
  document.getElementById('form-title').textContent='Yeni Yazı';
  ['f-title','f-slug','f-emoji','f-tags','f-summary','f-content'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fstatus').textContent='';
  document.getElementById('preview').style.display='none';
  previewOpen=false;
}

</script>
</body>
</html>
