<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020810"/>
      <stop offset="0.5" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0d1f35"/>
    </linearGradient>
    <radialGradient id="neb" cx="0.5" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#00c8f0" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#6020d0" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#00c8f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c8f0"/>
      <stop offset="1" stop-color="#7ae6ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="540" cy="380" r="560" fill="url(#neb)"/>

  <!-- HUD -->
  <g stroke="#00c8f0" stroke-opacity="0.7" stroke-width="3" fill="none">
    <path d="M34,64 V34 H64"/><path d="M1016,64 V34 H986"/>
    <path d="M34,1016 V1046 H64"/><path d="M1016,1016 V1046 H986"/>
  </g>
  <text x="84" y="44" font-family="'DejaVu Sans Mono',monospace" font-size="16" fill="#00c8f0" letter-spacing="2">MOD.04+08 ▸ QKD</text>
  <text x="996" y="44" text-anchor="end" font-family="'DejaVu Sans Mono',monospace" font-size="16" fill="#7a93a8" letter-spacing="2">03 / 05</text>

  <text x="540" y="196" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="72" letter-spacing="3" fill="url(#cyan)" filter="url(#glow)">ŞİFRELEME</text>
  <text x="540" y="250" text-anchor="middle" font-family="'DejaVu Sans Mono',monospace" font-size="16" letter-spacing="4" fill="#7a93a8">04 :: BB84 ŞİFRELEME · 08 :: IŞINLANMA</text>

  <!-- Alice to Bob channel -->
  <rect x="120" y="300" width="840" height="250" rx="14" fill="#060d18" stroke="#00c8f0" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="154" y="336" font-family="'DejaVu Sans Mono',monospace" font-size="13" letter-spacing="2" fill="#4a6070">$ qkd --bb84 --secure-channel</text>

  <!-- Alice -->
  <circle cx="300" cy="440" r="52" fill="rgba(0,200,240,0.08)" stroke="#00c8f0" stroke-width="2"/>
  <text x="300" y="446" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="22" fill="#00c8f0">ALICE</text>
  <text x="300" y="474" text-anchor="middle" font-family="'DejaVu Sans Mono',monospace" font-size="12" fill="#7a93a8">GÖNDERİCİ</text>

  <!-- Bob -->
  <circle cx="780" cy="440" r="52" fill="rgba(160,96,255,0.08)" stroke="#a060ff" stroke-width="2"/>
  <text x="780" y="446" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="22" fill="#a060ff">BOB</text>
  <text x="780" y="474" text-anchor="middle" font-family="'DejaVu Sans Mono',monospace" font-size="12" fill="#7a93a8">ALICI</text>

  <!-- channel -->
  <line x1="352" y1="440" x2="728" y2="440" stroke="#00c8f0" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="8 8"/>
  <g fill="#7ae6ff">
    <circle cx="420" cy="440" r="7" filter="url(#glow)"/>
    <circle cx="480" cy="440" r="7" filter="url(#glow)"/>
    <circle cx="540" cy="440" r="7" fill="#00f0a0" filter="url(#glow)"/>
    <circle cx="600" cy="440" r="7" filter="url(#glow)"/>
    <circle cx="660" cy="440" r="7" filter="url(#glow)"/>
  </g>
  <text x="540" y="492" text-anchor="middle" font-family="'DejaVu Sans Mono',monospace" font-size="13" letter-spacing="2" fill="#7a93a8">KUANTUM KANALI · FOTONLAR</text>

  <!-- Eve wiretap -->
  <rect x="470" y="350" width="140" height="34" rx="17" fill="rgba(255,68,102,0.08)" stroke="rgba(255,68,102,0.5)" stroke-width="1.5"/>
  <text x="540" y="372" text-anchor="middle" font-family="'DejaVu Sans Mono',monospace" font-size="13" letter-spacing="2" fill="#ff4466">👁 EVE DİNLERSE →</text>

  <!-- key -->
  <text x="540" y="596" text-anchor="middle" font-family="'DejaVu Sans Mono',monospace" font-size="15" letter-spacing="2" fill="#7a93a8">PAYLAŞILAN GİZLİ ANAHTAR</text>
  <text x="540" y="634" text-anchor="middle" font-family="'DejaVu Sans Mono',monospace" font-size="30" letter-spacing="6" fill="#00f0a0" filter="url(#glow)">1010 0110 1100 0101</text>

  <!-- security bar -->
  <rect x="120" y="668" width="840" height="90" rx="14" fill="#0d1f35" stroke="#00c8f0" stroke-opacity="0.25" stroke-width="1.5"/>
  <text x="154" y="700" font-family="'DejaVu Sans Mono',monospace" font-size="13" letter-spacing="2" fill="#7a93a8">GÜVENLİK DÜZEYİ</text>
  <rect x="154" y="716" width="600" height="10" rx="5" fill="rgba(0,200,240,0.15)"/>
  <rect x="154" y="716" width="600" height="10" rx="5" fill="url(#cyan)" filter="url(#glow)"/>
  <text x="774" y="726" font-family="'DejaVu Sans Mono',monospace" font-size="15" fill="#00f0a0">%100</text>
  <text x="154" y="748" font-family="'DejaVu Sans Mono',monospace" font-size="12" letter-spacing="1" fill="#7a93a8">DİNLEME → ÖLÇÜM → DURUM BOZULUR → FARK EDİLİR</text>

  <!-- teleport line -->
  <text x="540" y="812" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="500" font-size="24" fill="#e8edf5">Modül 08: <tspan fill="#00c8f0">Işınlanma</tspan> maddeyi değil,</text>
  <text x="540" y="850" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="500" font-size="24" fill="#e8edf5"><tspan fill="#00c8f0">bilgiyi</tspan> taşır — anında ve birebir.</text>

  <text x="540" y="968" text-anchor="middle" font-family="'DejaVu Sans Mono',monospace" font-size="16" letter-spacing="4" fill="#4a6070">quantro-1.vercel.app</text>
</svg>
