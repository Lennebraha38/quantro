  <text x="950" y="126" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="20" letter-spacing="2" fill="#00f0a0">SECURE</text>
  <text x="720" y="126" font-family="'JetBrains Mono',monospace" font-size="20" fill="#4a6070">MOD 03/05</text>

  <text x="540" y="236" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="72" letter-spacing="4" fill="url(#cyan)" filter="url(#glowC)">ŞİFRELEME</text>
  <text x="540" y="288" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="20" letter-spacing="3" fill="#7a93a8">// 04_QUANTUM_CRYPTO_BB84</text>
