<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020810"/>
      <stop offset="0.5" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0d1f35"/>
    </linearGradient>
    <radialGradient id="neb" cx="0.5" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#00c8f0" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#6020d0" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#00c8f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c8f0"/>
      <stop offset="1" stop-color="#7ae6ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="540" cy="380" r="560" fill="url(#neb)"/>

  <!-- HUD -->
  <g stroke="#00c8f0" stroke-opacity="0.7" stroke-width="3" fill="none">
    <path d="M34,64 V34 H64"/><path d="M1016,64 V34 H986"/>
    <path d="M34,1016 V1046 H64"/><path d="M1016,1016 V1046 H986"/>
  </g>
  <text x="84" y="44" font-family="'DejaVu Sans Mono',monospace" font-size="16" fill="#00c8f0" letter-spacing="2">MOD.02 ▸ CIRCUIT</text>
  <text x="996" y="44" text-anchor="end" font-family="'DejaVu Sans Mono',monospace" font-size="16" fill="#7a93a8" letter-spacing="2">02 / 05</text>

  <text x="540" y="196" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="72" letter-spacing="3" fill="url(#cyan)" filter="url(#glow)">DEVRELER</text>
  <text x="540" y="250" text-anchor="middle" font-family="'DejaVu Sans Mono',monospace" font-size="16" letter-spacing="4" fill="#7a93a8">02 :: KUANTUM DEVRE SİMÜLATÖRÜ</text>

  <!-- circuit diagram -->
  <rect x="120" y="290" width="560" height="330" rx="14" fill="#060d18" stroke="#00c8f0" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="154" y="326" font-family="'DejaVu Sans Mono',monospace" font-size="13" letter-spacing="2" fill="#4a6070">$ qcirc --build bell_state</text>

  <!-- lanes -->
  <g>
    <text x="154" y="392" font-family="'DejaVu Sans Mono',monospace" font-size="18" fill="#7a93a8">q0</text>
    <line x1="200" y1="388" x2="650" y2="388" stroke="rgba(0,200,240,0.4)" stroke-width="1.5"/>
    <text x="154" y="492" font-family="'DejaVu Sans Mono',monospace" font-size="18" fill="#7a93a8">q1</text>
    <line x1="200" y1="488" x2="650" y2="488" stroke="rgba(0,200,240,0.4)" stroke-width="1.5"/>
    <!-- gates -->
    <g font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="17" fill="#020810" text-anchor="middle">
      <rect x="260" y="362" width="52" height="52" rx="8" fill="#00c8f0" filter="url(#glow)"/><text x="286" y="396">H</text>
      <rect x="360" y="362" width="52" height="52" rx="8" fill="#ff4466" filter="url(#glow)"/><text x="386" y="396">X</text>
      <rect x="470" y="462" width="52" height="52" rx="8" fill="#00f0a0" filter="url(#glow)"/><text x="496" y="496">H</text>
      <!-- CNOT -->
      <circle cx="585" cy="388" r="10" fill="#a060ff" filter="url(#glow)"/>
      <circle cx="585" cy="488" r="17" fill="none" stroke="#a060ff" stroke-width="3" filter="url(#glow)"/>
    </g>
    <line x1="585" y1="398" x2="585" y2="471" stroke="#a060ff" stroke-width="2"/>
  </g>

  <text x="154" y="586" font-family="'DejaVu Sans Mono',monospace" font-size="14" letter-spacing="2" fill="#00c8f0">▸ 1024 ATIŞ</text>
  <!-- measurement bars -->
  <g>
    <rect x="290" y="552" width="36" height="34" rx="4" fill="#00c8f0" filter="url(#glow)"/>
    <rect x="336" y="566" width="36" height="20" rx="4" fill="#00c8f0" fill-opacity="0.35"/>
    <rect x="382" y="560" width="36" height="26" rx="4" fill="#00c8f0" fill-opacity="0.35"/>
    <text x="322" y="610" font-family="'DejaVu Sans Mono',monospace" font-size="12" fill="#7a93a8" text-anchor="middle">|00⟩</text>
    <text x="372" y="610" font-family="'DejaVu Sans Mono',monospace" font-size="12" fill="#7a93a8" text-anchor="middle">|01⟩</text>
    <text x="418" y="610" font-family="'DejaVu Sans Mono',monospace" font-size="12" fill="#7a93a8" text-anchor="middle">|10⟩</text>
  </g>

  <!-- right panel: Bloch + Bell -->
  <rect x="706" y="290" width="254" height="330" rx="14" fill="#0d1f35" stroke="#00c8f0" stroke-opacity="0.25" stroke-width="1.5"/>
  <circle cx="833" cy="400" r="72" fill="none" stroke="rgba(0,200,240,0.3)" stroke-width="1.5"/>
  <ellipse cx="833" cy="400" rx="72" ry="26" fill="none" stroke="rgba(0,200,240,0.3)" stroke-width="1.5"/>
  <ellipse cx="833" cy="400" rx="26" ry="72" fill="none" stroke="rgba(0,200,240,0.3)" stroke-width="1.5"/>
  <line x1="833" y1="400" x2="897" y2="352" stroke="#7ae6ff" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="897" cy="352" r="9" fill="#7ae6ff" filter="url(#glow)"/>
  <text x="833" y="510" font-family="'DejaVu Sans Mono',monospace" font-size="15" letter-spacing="2" fill="#7a93a8" text-anchor="middle">BLOCH KÜRESİ</text>
  <text x="833" y="548" font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="22" fill="url(#cyan)" text-anchor="middle" filter="url(#glow)">|Φ⁺⟩ = (|00⟩+|11⟩)/√2</text>
  <text x="833" y="584" font-family="'Space Grotesk',sans-serif" font-weight="400" font-size="17" fill="#7a93a8" text-anchor="middle">Bell durumu · dolanıklık</text>

  <text x="540" y="820" text-anchor="middle" font-family="'DejaVu Sans Mono',monospace" font-size="14" letter-spacing="2" fill="#00c8f0">▸ H SÜPERPOZİSYON · X NOT · CNOT DOLANIKLIK</text>
  <text x="540" y="862" text-anchor="middle" font-family="'DejaVu Sans Mono',monospace" font-size="14" letter-spacing="2" fill="#7a93a8">▸ İKİ KUBİT · SÜRÜKLE-BIRAK · ANLIK SONUÇ</text>
  <text x="540" y="904" text-anchor="middle" font-family="'DejaVu Sans Mono',monospace" font-size="14" letter-spacing="2" fill="#a060ff">▸ MOD.09 BLOCH KÜRESİ İLE GÖRSELLEŞTİR</text>

  <text x="540" y="968" text-anchor="middle" font-family="'DejaVu Sans Mono',monospace" font-size="16" letter-spacing="4" fill="#4a6070">quantro-1.vercel.app</text>
</svg>
