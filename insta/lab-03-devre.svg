<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#020810"/>
      <stop offset="0.5" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0d1f35"/>
    </linearGradient>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#00c8f0" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c8f0"/>
      <stop offset="1" stop-color="#7ae6ff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#00c8f0" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#00c8f0"/>
    </linearGradient>
    <filter id="glowC" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowG" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowP" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#grid)"/>

  <g stroke="#00c8f0" stroke-opacity="0.6" stroke-width="2.5" fill="none">
    <path d="M40,74 V40 H74"/><path d="M1006,74 V40 H1040"/>
    <path d="M40,1006 V1040 H74"/><path d="M1006,1006 V1040 H1040"/>
  </g>

  <text x="60" y="126" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="24" letter-spacing="3" fill="#00c8f0">QUANTRO_LAB</text>
  <circle cx="930" cy="118" r="8" fill="#00f0a0" filter="url(#glowG)"/>
  <text x="950" y="126" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="20" letter-spacing="2" fill="#00f0a0">RUNNING</text>
  <text x="720" y="126" font-family="'JetBrains Mono',monospace" font-size="20" fill="#4a6070">MOD 02/05</text>

  <text x="540" y="236" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="72" letter-spacing="4" fill="url(#cyan)" filter="url(#glowC)">DEVRE</text>
  <text x="540" y="288" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="20" letter-spacing="3" fill="#7a93a8">// 02_QUANTUM_CIRCUIT_SIM</text>
  <line x1="380" y1="322" x2="700" y2="322" stroke="#00c8f0" stroke-opacity="0.35" stroke-width="2"/>

  <!-- circuit board -->
  <rect x="110" y="356" width="860" height="290" rx="16" fill="#020810" stroke="#00c8f0" stroke-opacity="0.3" stroke-width="2"/>

  <!-- wires -->
  <line x1="150" y1="430" x2="920" y2="430" stroke="#00c8f0" stroke-opacity="0.7" stroke-width="2"/>
  <line x1="150" y1="560" x2="920" y2="560" stroke="#00c8f0" stroke-opacity="0.7" stroke-width="2"/>
  <text x="140" y="436" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="22" fill="#7a93a8" text-anchor="end">q0</text>
  <text x="140" y="566" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="22" fill="#7a93a8" text-anchor="end">q1</text>

  <!-- gate H -->
  <rect x="300" y="382" width="70" height="96" rx="6" fill="#0d1f35" stroke="#a060ff" stroke-width="2.5"/>
  <text x="335" y="444" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="34" fill="#a060ff" filter="url(#glowP)">H</text>

  <!-- gate X -->
  <rect x="440" y="382" width="70" height="96" rx="6" fill="#0d1f35" stroke="#ff4466" stroke-width="2.5"/>
  <text x="475" y="444" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="34" fill="#ff4466" filter="url(#glowC)">X</text>

  <!-- CNOT -->
  <circle cx="610" cy="430" r="12" fill="#00f0a0" filter="url(#glowG)"/>
  <line x1="610" y1="442" x2="610" y2="548" stroke="#00f0a0" stroke-width="2.5"/>
  <circle cx="610" cy="560" r="20" fill="none" stroke="#00f0a0" stroke-width="2.5"/>
  <text x="610" y="569" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="22" fill="#00f0a0" filter="url(#glowG)">⊕</text>

  <!-- measurement -->
  <g stroke="#7ae6ff" stroke-width="3" fill="none" opacity="0.9">
    <path d="M740,430 L840,430"/>
    <path d="M840,412 L840,448 M850,430 H872"/>
  </g>
  <line x1="870" y1="430" x2="920" y2="430" stroke="#7ae6ff" stroke-width="3"/>
  <path d="M880,424 L900,424 L900,452 L880,452 Z" fill="#7ae6ff" fill-opacity="0.5" stroke="#7ae6ff" stroke-width="2"/>
  <text x="900" y="482" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="18" fill="#7ae6ff">ÖLÇ</text>

  <!-- legend -->
  <text x="150" y="688" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="17" letter-spacing="2" fill="#7a93a8">H = SÜPERPOZİSYON</text>
  <text x="420" y="688" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="17" letter-spacing="2" fill="#7a93a8">CNOT = DOLANIKLIK</text>
  <text x="720" y="688" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="17" letter-spacing="2" fill="#7a93a8">X = NOT</text>

  <!-- measurement bars -->
  <rect x="110" y="720" width="860" height="180" rx="16" fill="#0d1f35" stroke="#00c8f0" stroke-opacity="0.25" stroke-width="1.5"/>
  <text x="150" y="764" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="18" letter-spacing="2" fill="#00c8f0">ÖLÇÜM // 1024 ATIŞ</text>
  <g>
    <rect x="290" y="846" width="56" height="52" fill="url(#bar)" filter="url(#glowC)"/>
    <text x="318" y="838" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="20" fill="#e8edf5">50%</text>
    <text x="318" y="922" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="18" fill="#7a93a8">00</text>

    <rect x="460" y="892" width="56" height="6" fill="#00c8f0" fill-opacity="0.3"/>
    <text x="488" y="884" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="18" fill="#7a93a8">~0</text>
    <text x="488" y="922" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="18" fill="#7a93a8">01</text>

    <rect x="630" y="892" width="56" height="6" fill="#00c8f0" fill-opacity="0.3"/>
    <text x="658" y="884" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="18" fill="#7a93a8">~0</text>
    <text x="658" y="922" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="18" fill="#7a93a8">10</text>

    <rect x="800" y="852" width="56" height="46" fill="url(#bar)" filter="url(#glowC)"/>
    <text x="828" y="844" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="20" fill="#e8edf5">46%</text>
    <text x="828" y="922" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="18" fill="#7a93a8">11</text>
  </g>

  <text x="540" y="1018" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="22" fill="#00f0a0" filter="url(#glowG)">|Φ⁺⟩ = (|00⟩ + |11⟩)/√2</text>
</svg>
