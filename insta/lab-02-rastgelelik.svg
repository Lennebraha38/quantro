<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020810"/>
      <stop offset="0.5" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0d1f35"/>
    </linearGradient>
    <radialGradient id="neb" cx="0.5" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#00c8f0" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#6020d0" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#00c8f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c8f0"/>
      <stop offset="1" stop-color="#7ae6ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="540" cy="380" r="560" fill="url(#neb)"/>

  <!-- HUD corners -->
  <g stroke="#00c8f0" stroke-opacity="0.7" stroke-width="3" fill="none">
    <path d="M34,64 V34 H64"/><path d="M1016,64 V34 H986"/>
    <path d="M34,1016 V1046 H64"/><path d="M1016,1016 V1046 H986"/>
  </g>
  <text x="84" y="44" font-family="'DejaVu Sans Mono',monospace" font-size="16" fill="#00c8f0" letter-spacing="2">MOD.01 ▸ QRNG</text>
  <text x="996" y="44" text-anchor="end" font-family="'DejaVu Sans Mono',monospace" font-size="16" fill="#7a93a8" letter-spacing="2">01 / 05</text>

  <text x="540" y="196" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="72" letter-spacing="3" fill="url(#cyan)" filter="url(#glow)">RASTGELELİK</text>
  <text x="540" y="250" text-anchor="middle" font-family="'DejaVu Sans Mono',monospace" font-size="16" letter-spacing="4" fill="#7a93a8">01 :: KUANTUM RASTGELELİK MOTORU</text>

  <!-- status pill -->
  <rect x="380" y="278" width="320" height="40" rx="20" fill="rgba(0,240,160,0.08)" stroke="rgba(0,240,160,0.4)" stroke-width="1.5"/>
  <circle cx="410" cy="298" r="6" fill="#00f0a0" filter="url(#glow)"/>
  <text x="430" y="304" font-family="'DejaVu Sans Mono',monospace" font-size="15" letter-spacing="2" fill="#00f0a0">QRNG ▸ ANU CANLI BAĞLANTI</text>

  <!-- random digit stream -->
  <rect x="120" y="346" width="840" height="120" rx="14" fill="#060d18" stroke="#00c8f0" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="154" y="382" font-family="'DejaVu Sans Mono',monospace" font-size="13" letter-spacing="2" fill="#4a6070">$ quantro.qrng --generate --real</text>
  <text x="154" y="420" font-family="'DejaVu Sans Mono',monospace" font-size="34" letter-spacing="8" fill="#00c8f0" filter="url(#glow)">8 3 5 1 9 4 2 7 6 0</text>
  <text x="154" y="452" font-family="'DejaVu Sans Mono',monospace" font-size="13" letter-spacing="2" fill="#7a93a8">> 3841095276 · kaynak: vakum dalgalanması ✓</text>

  <!-- waveform -->
  <g stroke="url(#cyan)" stroke-width="3.5" fill="none">
    <path d="M120,560 Q200,470 280,560 T440,560 T600,560 T760,560 T920,560 T960,560"/>
  </g>
  <circle cx="240" cy="515" r="7" fill="#7ae6ff" filter="url(#glow)"/>
  <circle cx="440" cy="605" r="7" fill="#7ae6ff" filter="url(#glow)"/>
  <circle cx="640" cy="515" r="7" fill="#7ae6ff" filter="url(#glow)"/>
  <circle cx="840" cy="605" r="7" fill="#a060ff" filter="url(#glow)"/>
  <text x="540" y="650" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="500" font-size="26" letter-spacing="1" fill="#e8edf5">Süperpozisyon tabanlı gerçek belirsizlik</text>

  <!-- explain box -->
  <rect x="120" y="692" width="840" height="196" rx="14" fill="#0d1f35" stroke="#00c8f0" stroke-opacity="0.25" stroke-width="1.5"/>
  <text x="154" y="742" font-family="'DejaVu Sans Mono',monospace" font-size="14" letter-spacing="2" fill="#00c8f0">▸ KLASİK</text>
  <text x="300" y="742" font-family="'Space Grotesk',sans-serif" font-weight="400" font-size="21" fill="#7a93a8">algoritma → sahte rastgelelik</text>
  <text x="154" y="786" font-family="'DejaVu Sans Mono',monospace" font-size="14" letter-spacing="2" fill="#00c8f0">▸ QUANTRO</text>
  <text x="300" y="786" font-family="'Space Grotesk',sans-serif" font-weight="400" font-size="21" fill="#e8edf5">ANU motoru → <tspan fill="#00c8f0">gerçek kuantum</tspan> belirsizlik</text>
  <text x="154" y="830" font-family="'DejaVu Sans Mono',monospace" font-size="14" letter-spacing="2" fill="#a060ff">▸ Δx·Δp ≥ ℏ/2</text>
  <text x="300" y="830" font-family="'Space Grotesk',sans-serif" font-weight="400" font-size="21" fill="#e8edf5">Heisenberg — doğanın kendisi</text>
  <text x="154" y="866" font-family="'DejaVu Sans Mono',monospace" font-size="14" letter-spacing="2" fill="#00f0a0">▸ CHI²</text>
  <text x="300" y="866" font-family="'Space Grotesk',sans-serif" font-weight="400" font-size="21" fill="#7a93a8">istediğin sayıyı üret, <tspan fill="#00f0a0">𝝌² testi</tspan> ile doğrula</text>

  <text x="540" y="958" text-anchor="middle" font-family="'DejaVu Sans Mono',monospace" font-size="16" letter-spacing="4" fill="#4a6070">quantro-1.vercel.app</text>
</svg>
