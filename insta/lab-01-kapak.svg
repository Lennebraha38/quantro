<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020810"/>
      <stop offset="0.5" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0d1f35"/>
    </linearGradient>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#00c8f0" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00c8f0" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#00c8f0" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#00c8f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c8f0"/>
      <stop offset="1" stop-color="#7ae6ff"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c8f0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00c8f0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00c8f0" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowC" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowW" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#grid)"/>
  <circle cx="540" cy="400" r="400" fill="url(#coreGlow)"/>

  <!-- HUD corners -->
  <g stroke="#00c8f0" stroke-opacity="0.6" stroke-width="2.5" fill="none">
    <path d="M40,74 V40 H74"/>
    <path d="M1006,74 V40 H1040"/>
    <path d="M40,1006 V1040 H74"/>
    <path d="M1006,1006 V1040 H1040"/>
  </g>

  <!-- top status bar -->
  <text x="60" y="126" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="24" letter-spacing="3" fill="#00c8f0">QUANTRO_LAB</text>
  <text x="500" y="126" font-family="'JetBrains Mono',monospace" font-size="20" fill="#4a6070">// 9_MODULE</text>
  <circle cx="930" cy="118" r="8" fill="#00f0a0" filter="url(#glowW)"/>
  <text x="950" y="126" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="20" letter-spacing="2" fill="#00f0a0">ONLINE</text>

  <!-- core hexagon -->
  <polygon points="540,270 669.8,345 669.8,495 540,570 410.2,495 410.2,345"
    fill="none" stroke="#00c8f0" stroke-width="2.5" filter="url(#glowC)"/>
  <polygon points="540,295 651,358 651,482 540,545 429,482 429,358"
    fill="none" stroke="#00c8f0" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="540" cy="420" r="70" fill="none" stroke="#00c8f0" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 8"/>
  <text x="540" y="440" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="52" fill="url(#cyan)" filter="url(#glowC)">ψ</text>

  <!-- circuit traces -->
  <g stroke="url(#cyan)" stroke-width="2.5" fill="none" opacity="0.9">
    <path d="M540,270 L540,158"/><path d="M540,158 H585"/>
    <path d="M669.8,345 L980,250"/>
    <path d="M669.8,495 L985,560"/>
    <path d="M540,570 L540,640"/>
    <path d="M410.2,495 L95,560"/>
    <path d="M410.2,345 L100,250"/>
  </g>
  <g fill="#00c8f0" filter="url(#glowC)">
    <circle cx="585" cy="158" r="6"/><circle cx="980" cy="250" r="6"/><circle cx="985" cy="560" r="6"/>
    <circle cx="540" cy="640" r="6"/><circle cx="95" cy="560" r="6"/><circle cx="100" cy="250" r="6"/>
  </g>

  <!-- floating data chips -->
  <g font-family="'JetBrains Mono',monospace" font-size="16" fill="#4a6070">
    <text x="150" y="200">|0⟩</text><text x="880" y="190">|1⟩</text>
    <text x="900" y="700">Δx·Δp≥ℏ/2</text><text x="130" y="720">H₀=67.4</text>
  </g>

  <!-- scan line -->
  <line x1="150" y1="742" x2="930" y2="742" stroke="url(#scan)" stroke-width="3"/>
  <polygon points="150,742 162,736 162,748" fill="#00c8f0"/>

  <!-- title -->
  <text x="540" y="812" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="300" font-size="58" letter-spacing="6" fill="#e8edf5">KUANTUM</text>
  <text x="540" y="918" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="100" letter-spacing="10" fill="none" stroke="url(#cyan)" stroke-width="2.5" filter="url(#glowC)">LAB</text>

  <!-- subtitle + badge -->
  <text x="540" y="972" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="22" letter-spacing="4" fill="#7a93a8">9 ÖZGÜN İNTERAKTİF ARAÇ</text>
  <rect x="398" y="998" width="284" height="46" rx="23" fill="#00c8f0" fill-opacity="0.14" stroke="#00f0a0" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="540" y="1028" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="17" letter-spacing="3" fill="#00f0a0">▼ TÜRKİYE'DE İLK</text>
</svg>
