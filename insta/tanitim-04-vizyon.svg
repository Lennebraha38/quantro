<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020810"/>
      <stop offset="0.5" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0d1f35"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#00c8f0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00c8f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c8f0"/>
      <stop offset="1" stop-color="#7ae6ff"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="540" cy="360" r="430" fill="url(#glow)"/>

  <!-- stars / universe -->
  <g fill="#e8edf5">
    <circle cx="180" cy="240" r="2.5" fill-opacity="0.6"/>
    <circle cx="860" cy="200" r="2.5" fill-opacity="0.6"/>
    <circle cx="920" cy="520" r="2" fill-opacity="0.5"/>
    <circle cx="140" cy="600" r="2" fill-opacity="0.5"/>
    <circle cx="780" cy="700" r="2.5" fill-opacity="0.6"/>
  </g>

  <text x="540" y="110" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="26" letter-spacing="8" fill="#4a6070">QUANTRO</text>
  <circle cx="90" cy="98" r="34" fill="none" stroke="#00c8f0" stroke-opacity="0.5" stroke-width="2"/>
  <text x="90" y="107" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="30" fill="#00c8f0">4</text>
  <circle cx="990" cy="98" r="34" fill="none" stroke="#00c8f0" stroke-opacity="0.5" stroke-width="2"/>
  <text x="990" y="107" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="30" fill="#00c8f0">5</text>

  <text x="540" y="250" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="76" letter-spacing="3" fill="url(#cyan)">VİZYONUMUZ</text>

  <line x1="380" y1="310" x2="700" y2="310" stroke="#00c8f0" stroke-opacity="0.35" stroke-width="2"/>

  <text x="540" y="440" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="400" font-size="30" letter-spacing="1" fill="#e8edf5">Kuantum sınırında çalışan bağımsız</text>
  <text x="540" y="490" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="400" font-size="30" letter-spacing="1" fill="#e8edf5">bir bilim üssü olmak.</text>

  <text x="540" y="590" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="500" font-size="32" letter-spacing="1" fill="#00c8f0">Evrenin dokusunu anlama</text>
  <text x="540" y="636" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="500" font-size="32" letter-spacing="1" fill="#00c8f0">yolculuğunda ilham vermek.</text>

  <!-- quote strip -->
  <rect x="140" y="710" width="800" height="120" rx="20" fill="#0d1f35" stroke="#00c8f0" stroke-opacity="0.25" stroke-width="1.5"/>
  <text x="540" y="762" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="400" font-size="26" letter-spacing="1" fill="#e8edf5" font-style="italic">"Planck ölçeğinden kozmolojik ufka —</text>
  <text x="540" y="802" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="400" font-size="26" letter-spacing="1" fill="#e8edf5" font-style="italic">geniş bir spektrumda çalışıyoruz."</text>

  <text x="540" y="972" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="400" font-size="22" letter-spacing="3" fill="#4a6070">quantro-1.vercel.app</text>
</svg>
