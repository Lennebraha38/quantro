<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020810"/>
      <stop offset="0.5" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0d1f35"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.5">
      <stop offset="0" stop-color="#00c8f0" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#00c8f0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00c8f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c8f0"/>
      <stop offset="1" stop-color="#7ae6ff"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="540" cy="420" r="470" fill="url(#glow)"/>

  <!-- subtle orbit rings -->
  <g fill="none" stroke="#00c8f0" stroke-opacity="0.14">
    <ellipse cx="540" cy="420" rx="330" ry="130" stroke-width="1.5"/>
    <ellipse cx="540" cy="420" rx="230" ry="90" stroke-width="1.5"/>
    <ellipse cx="540" cy="420" rx="130" ry="52" stroke-width="1.5"/>
  </g>
  <g fill="#00c8f0" fill-opacity="0.5">
    <circle cx="870" cy="340" r="7"/>
    <circle cx="212" cy="500" r="7"/>
    <circle cx="300" cy="360" r="5"/>
    <circle cx="780" cy="510" r="5"/>
  </g>

  <!-- logo -->
  <text x="540" y="92" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="30" letter-spacing="10" fill="#e8edf5">QUANTRO</text>
  <text x="540" y="128" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="400" font-size="18" letter-spacing="5" fill="#4a6070">KUANTUM MEKANİĞİ &amp; ASTROFİZİK</text>

  <!-- central atom -->
  <circle cx="540" cy="400" r="58" fill="#00c8f0" fill-opacity="0.08" stroke="#00c8f0" stroke-width="3"/>
  <circle cx="540" cy="400" r="9" fill="url(#cyan)"/>
  <ellipse cx="540" cy="400" rx="150" ry="60" fill="none" stroke="url(#cyan)" stroke-width="2.5" transform="rotate(-25 540 400)"/>
  <ellipse cx="540" cy="400" rx="150" ry="60" fill="none" stroke="url(#cyan)" stroke-width="2.5" transform="rotate(25 540 400)"/>
  <circle cx="618" cy="327" r="11" fill="#7ae6ff"/>
  <circle cx="466" cy="473" r="11" fill="#7ae6ff"/>
  <circle cx="634" cy="450" r="7" fill="#00c8f0"/>
  <circle cx="470" cy="340" r="7" fill="#00c8f0"/>

  <!-- main title -->
  <text x="540" y="628" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="300" font-size="62" letter-spacing="2" fill="#e8edf5">Evrenin Dokusu</text>
  <text x="540" y="712" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="88" letter-spacing="4" fill="url(#cyan)">TİTREŞİYOR</text>

  <!-- divider -->
  <line x1="380" y1="776" x2="700" y2="776" stroke="#00c8f0" stroke-opacity="0.35" stroke-width="2"/>

  <text x="540" y="836" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="400" font-size="26" letter-spacing="3" fill="#4a6070">KUANTUM SINIRINDA BAĞIMSIZ ARAŞTIRMA</text>

  <!-- CTA -->
  <rect x="398" y="900" width="284" height="78" rx="39" fill="#00c8f0"/>
  <text x="540" y="947" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="28" letter-spacing="4" fill="#020810">TANIYIN</text>

  <text x="540" y="1030" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="400" font-size="22" letter-spacing="3" fill="#4a6070">quantro-1.vercel.app</text>
</svg>
