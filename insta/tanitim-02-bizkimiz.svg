<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020810"/>
      <stop offset="0.5" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0d1f35"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#00c8f0" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00c8f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c8f0"/>
      <stop offset="1" stop-color="#7ae6ff"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="540" cy="360" r="430" fill="url(#glow)"/>

  <!-- section number -->
  <text x="540" y="110" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="26" letter-spacing="8" fill="#4a6070">QUANTRO</text>
  <circle cx="90" cy="98" r="34" fill="none" stroke="#00c8f0" stroke-opacity="0.5" stroke-width="2"/>
  <text x="90" y="107" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="30" fill="#00c8f0">2</text>
  <circle cx="990" cy="98" r="34" fill="none" stroke="#00c8f0" stroke-opacity="0.5" stroke-width="2"/>
  <text x="990" y="107" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="30" fill="#00c8f0">5</text>

  <text x="540" y="240" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="76" letter-spacing="3" fill="#e8edf5">BİZ KİMİZ?</text>

  <!-- 3 pillars -->
  <g font-family="'Space Grotesk',sans-serif">
    <!-- pillar 1 -->
    <rect x="120" y="340" width="240" height="300" rx="18" fill="#0d1f35" stroke="#00c8f0" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="240" cy="420" r="44" fill="#00c8f0" fill-opacity="0.1" stroke="#00c8f0" stroke-width="2"/>
    <text x="240" y="438" text-anchor="middle" font-weight="700" font-size="40" fill="#00c8f0">K</text>
    <text x="240" y="510" text-anchor="middle" font-weight="700" font-size="28" letter-spacing="2" fill="#e8edf5">KUANTUM</text>
    <text x="240" y="560" text-anchor="middle" font-weight="400" font-size="20" fill="#4a6070">Planck ölçeğinde</text>
    <text x="240" y="594" text-anchor="middle" font-weight="400" font-size="20" fill="#4a6070">teorik araştırma</text>

    <!-- pillar 2 -->
    <rect x="420" y="340" width="240" height="300" rx="18" fill="#0d1f35" stroke="#00c8f0" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="540" cy="420" r="44" fill="#00c8f0" fill-opacity="0.1" stroke="#00c8f0" stroke-width="2"/>
    <text x="540" y="438" text-anchor="middle" font-weight="700" font-size="40" fill="#00c8f0">A</text>
    <text x="540" y="510" text-anchor="middle" font-weight="700" font-size="28" letter-spacing="2" fill="#e8edf5">ASTROFİZİK</text>
    <text x="540" y="560" text-anchor="middle" font-weight="400" font-size="20" fill="#4a6070">Kozmik yapılar ve</text>
    <text x="540" y="594" text-anchor="middle" font-weight="400" font-size="20" fill="#4a6070">karanlık madde</text>

    <!-- pillar 3 -->
    <rect x="720" y="340" width="240" height="300" rx="18" fill="#0d1f35" stroke="#00c8f0" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="840" cy="420" r="44" fill="#00c8f0" fill-opacity="0.1" stroke="#00c8f0" stroke-width="2"/>
    <text x="840" y="438" text-anchor="middle" font-weight="700" font-size="40" fill="#00c8f0">R</text>
    <text x="840" y="510" text-anchor="middle" font-weight="700" font-size="28" letter-spacing="2" fill="#e8edf5">ARGE</text>
    <text x="840" y="560" text-anchor="middle" font-weight="400" font-size="20" fill="#4a6070">Bağımsız, derin</text>
    <text x="840" y="594" text-anchor="middle" font-weight="400" font-size="20" fill="#4a6070">bilimsel üretim</text>
  </g>

  <!-- bottom statement -->
  <text x="540" y="760" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="400" font-size="24" letter-spacing="1" fill="#e8edf5">Kuantum mekaniği ve astrofizik alanlarında</text>
  <text x="540" y="800" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="400" font-size="24" letter-spacing="1" fill="#e8edf5">bağımsız araştırmalar yürüten bir ARGE merkeziyiz.</text>

  <!-- page dots -->
  <g fill="#4a6070">
    <circle cx="540" cy="880" r="6"/>
  </g>
  <circle cx="512" cy="880" r="6" fill="#4a6070"/>
  <circle cx="540" cy="880" r="8" fill="#00c8f0"/>
  <circle cx="568" cy="880" r="6" fill="#4a6070"/>
  <circle cx="596" cy="880" r="6" fill="#4a6070"/>
  <circle cx="624" cy="880" r="6" fill="#4a6070"/>

  <text x="540" y="960" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="400" font-size="22" letter-spacing="3" fill="#4a6070">quantro-1.vercel.app</text>
</svg>
