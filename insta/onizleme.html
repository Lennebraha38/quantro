<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantro — Instagram Prototipleri</title>
<style>
  body{margin:0;background:#020810;color:#e8edf5;font-family:Space Grotesk,system-ui,sans-serif;padding:30px}
  h1{color:#00c8f0;letter-spacing:3px;font-weight:700}
  p{color:#4a6070}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px;margin-top:20px}
  .card{background:#0d1f35;border-radius:16px;padding:16px;text-align:center}
  .card img{width:100%;border-radius:10px;display:block}
  .card h3{color:#00c8f0;margin:12px 0 4px;letter-spacing:2px}
  .row{display:flex;gap:10px;justify-content:center;margin-top:10px}
  .btn{color:#e8edf5;font-size:13px;text-decoration:none;border:1px solid #00c8f0;padding:8px 16px;border-radius:20px;display:inline-block;cursor:pointer;background:none;font-family:inherit}
  .btn:hover{background:#00c8f0;color:#020810}
  .zip{margin-top:24px;text-align:center}
  .zip .btn{font-size:15px;padding:12px 26px;background:#00c8f0;color:#020810;font-weight:700}
</style>
</head>
<body>
<h1>QUANTRO · Instagram Prototipleri</h1>
<p>Marka paleti (#020810 + #00c8f0) · Space Grotesk · 1080×1080</p>
<div class="grid">
  <div class="card">
    <img src="insta/01-dolaniklik-kapak.png" alt="Dolanıklık kapak">
    <h3>01 · Karusel Kapağı</h3>
    <div class="row"><button class="btn" onclick="dl('01-dolaniklik-kapak.png')">PNG İndir</button><button class="btn" onclick="dl('01-dolaniklik-kapak.svg')">SVG</button></div>
  </div>
  <div class="card">
    <img src="insta/02-planck-kart.png" alt="Planck kartı">
    <h3>02 · Bilgi Kartı</h3>
    <div class="row"><button class="btn" onclick="dl('02-planck-kart.png')">PNG İndir</button><button class="btn" onclick="dl('02-planck-kart.svg')">SVG</button></div>
  </div>
  <div class="card">
    <img src="insta/03-quiz.png" alt="Quiz">
    <h3>03 · Quiz</h3>
    <div class="row"><button class="btn" onclick="dl('03-quiz.png')">PNG İndir</button><button class="btn" onclick="dl('03-quiz.svg')">SVG</button></div>
  </div>
</div>
<div class="zip">
  <a class="btn" href="insta/quantro-instagram-prototipler.zip">⬇ TÜMÜNÜ TEK ZIP OLARAK İNDİR</a>
</div>
<script>
function dl(f){
  fetch('insta/'+f).then(r=>r.blob()).then(b=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download=f;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  });
}
</script>
</body>
</html>
