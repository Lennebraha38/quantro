<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020810"/>
      <stop offset="0.6" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0d1f35"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c8f0"/>
      <stop offset="1" stop-color="#7ae6ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#00c8f0" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00c8f0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="540" cy="430" r="430" fill="url(#glow)"/>

  <text x="540" y="86" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="28" letter-spacing="6" fill="#4a6070">QUANTRO</text>

  <!-- section tag -->
  <rect x="420" y="180" width="240" height="58" rx="29" fill="#00c8f0" fill-opacity="0.12"/>
  <text x="540" y="218" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="500" font-size="24" letter-spacing="4" fill="#00c8f0">BUGUNUN SAYISI</text>

  <!-- big number -->
  <text x="540" y="420" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="130" fill="#e8edf5">1.6 × 10</text>
  <text x="660" y="250" font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="60" fill="url(#cyan)">-35</text>
  <text x="540" y="540" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="500" font-size="30" letter-spacing="3" fill="#00c8f0">PLANCK UZUNLUGU</text>
  <text x="540" y="586" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="400" font-size="26" letter-spacing="2" fill="#4a6070">METRE</text>

  <!-- divider -->
  <line x1="240" y1="650" x2="840" y2="650" stroke="#00c8f0" stroke-opacity="0.2" stroke-width="2"/>

  <!-- fact line -->
  <text x="540" y="720" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="400" font-size="30" fill="#e8edf5">Uzay-zamanda anlamli olan</text>
  <text x="540" y="766" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="400" font-size="30" fill="#e8edf5">en kucuk uzunluk.</text>

  <!-- save indicator -->
  <g transform="translate(480,860)">
    <rect width="120" height="46" rx="23" fill="none" stroke="#4a6070" stroke-width="2"/>
    <text x="60" y="30" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="600" font-size="20" letter-spacing="2" fill="#4a6070">KAYDET</text>
  </g>

  <text x="540" y="990" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="400" font-size="24" letter-spacing="2" fill="#4a6070">quantro-1.vercel.app</text>
</svg>
