name: Perf — PageSpeed (Alan + Lab)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'   # her gece

permissions:
  contents: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    env:
      PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Kurulum
        run: npm ci
      - name: Alan + Lab metrikleri (PageSpeed Insights)
        if: ${{ env.PSI_API_KEY != '' }}
        run: |
          node scripts/metrics.mjs https://quantro-1.vercel.app mobile | tee pagespeed-metrics.log
      - name: PSI anahtarı yok — ölçüm atlandı
        if: ${{ env.PSI_API_KEY == '' }}
        run: echo "PSI_API_KEY tanımlı değil; metrik job'ı atlandı."
      - name: Metrik logunu kaydet
        if: ${{ env.PSI_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pagespeed-metrics
          path: pagespeed-metrics.log
          if-no-files-found: ignore