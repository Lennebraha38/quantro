<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --void:#020810;--deep:#07111f;--surface:#0d1f35;--subtle:#1e3248;
  --cyan:#00c8f0;--cyanM:rgba(0,200,240,0.35);--cyanD:rgba(0,200,240,0.1);
  --text:#e8edf5;--muted:#7a93a8;--green:#00f0a0;--red:#ff4466;--gold:#f0c040;
  --fd:'Syne',sans-serif;--fb:'Space Grotesk',sans-serif;--fm:'JetBrains Mono',monospace;
}
html{scroll-behavior:smooth}
body{background:var(--void);color:var(--text);font-family:var(--fb);overflow-x:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--cyanM)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

/* BG */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg-stars{position:absolute;inset:0;background-image:
  radial-gradient(1px 1px at 10% 8%,rgba(255,255,255,.6) 0%,transparent 100%),
  radial-gradient(1px 1px at 30% 15%,rgba(255,255,255,.4) 0%,transparent 100%),
  radial-gradient(1.5px 1.5px at 60% 6%,rgba(200,230,255,.7) 0%,transparent 100%),
  radial-gradient(1px 1px at 80% 12%,rgba(255,255,255,.5) 0%,transparent 100%),
  radial-gradient(1px 1px at 95% 22%,rgba(255,255,255,.3) 0%,transparent 100%),
  radial-gradient(1px 1px at 15% 45%,rgba(255,255,255,.4) 0%,transparent 100%),
  radial-gradient(1px 1px at 70% 40%,rgba(255,255,255,.3) 0%,transparent 100%),
  radial-gradient(1px 1px at 40% 70%,rgba(255,255,255,.4) 0%,transparent 100%),
  radial-gradient(1px 1px at 85% 75%,rgba(200,220,255,.4) 0%,transparent 100%);}
.bg-grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(0,200,240,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,240,.02) 1px,transparent 1px);
  background-size:64px 64px;}
.bg-neb{position:absolute;width:500px;height:500px;top:-80px;right:-80px;
  background:radial-gradient(ellipse at 50% 50%,rgba(0,80,200,.12) 0%,rgba(60,0,160,.07) 45%,transparent 70%);
  border-radius:50%;filter:blur(60px);}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:22px 0;transition:background .4s,padding .3s}
nav.sc{background:rgba(2,8,16,.92);backdrop-filter:blur(20px);padding:13px 0;border-bottom:1px solid rgba(0,200,240,.07)}
.ni{max-width:1200px;margin:0 auto;padding:0 40px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.nl{font-family:var(--fd);font-size:17px;font-weight:800;letter-spacing:5px;text-transform:uppercase;color:var(--text);text-decoration:none}
.nl em{color:var(--cyan);font-style:normal}
.nav-right{display:flex;gap:12px;align-items:center}
.nb{font-family:var(--fm);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);border:1px solid var(--cyanM);padding:9px 18px;text-decoration:none;transition:background .2s,color .2s;cursor:pointer;background:none}
.nb:hover{background:var(--cyan);color:var(--void)}
.nb.active{background:var(--cyan);color:var(--void)}

/* VIEWS */
.view{display:none;position:relative;z-index:1}
.view.active{display:block}

/* ── LIST VIEW ── */
.blog-hero{padding:140px 0 60px;text-align:center}
.blog-ey{display:inline-flex;align-items:center;gap:12px;margin-bottom:20px}
.blog-ey::before,.blog-ey::after{content:'';display:block;width:28px;height:1px;background:var(--cyan)}
.blog-ey span{font-family:var(--fm);font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--cyan)}
.blog-h1{font-family:var(--fd);font-size:clamp(44px,7vw,88px);font-weight:800;line-height:.92;letter-spacing:-2px;text-transform:uppercase;margin-bottom:16px}
.blog-h1 .o{color:transparent;-webkit-text-stroke:1.5px var(--cyan);display:block}
.blog-sub{font-size:14px;font-weight:300;color:rgba(232,237,245,.62);line-height:1.8;max-width:480px;margin:0 auto}

.blog-list{max-width:1200px;margin:0 auto;padding:0 40px 100px}
.blog-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:40px}
.blog-search{margin-bottom:16px}
.search-input{width:100%;max-width:480px;background:var(--deep);border:1px solid rgba(0,200,240,.15);color:var(--text);font-family:var(--fm);font-size:13px;letter-spacing:1px;padding:14px 18px;outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--cyan)}
.search-input::placeholder{color:var(--muted)}
.ftag{font-family:var(--fm);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);border:1px solid rgba(0,200,240,.12);padding:6px 14px;cursor:pointer;transition:all .2s;background:none}
.ftag:hover,.ftag.active{color:var(--cyan);border-color:var(--cyan);background:rgba(0,200,240,.06)}

.posts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.post-card{background:var(--deep);padding:36px;border-top:2px solid transparent;cursor:pointer;transition:border-color .3s,background .3s,transform .3s;position:relative;overflow:hidden}
.post-card::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 110%,rgba(0,200,240,.06) 0%,transparent 60%);opacity:0;transition:opacity .4s}
.post-card:hover{border-color:var(--cyan);background:var(--surface);transform:translateY(-3px)}
.post-card:hover::after{opacity:1}
.post-emoji{font-size:36px;margin-bottom:20px;display:block}
.post-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ptag{font-family:var(--fm);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(0,200,240,.78);border:1px solid rgba(0,200,240,.22);padding:3px 8px}
.post-title{font-family:var(--fd);font-size:20px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--text);margin-bottom:12px;line-height:1.15}
.post-summary{font-size:13px;color:rgba(232,237,245,.62);line-height:1.75;margin-bottom:20px}
.post-meta{display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(0,200,240,.07);padding-top:14px}
.post-date{font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--muted)}
.post-read{font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--cyan)}

/* loading/empty */
.loading{text-align:center;padding:80px 0;font-family:var(--fm);font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.loading::after{content:'';display:inline-block;width:6px;height:6px;background:var(--cyan);border-radius:50%;animation:ldot 1s ease-in-out infinite alternate;margin-left:8px}
@keyframes ldot{from{opacity:.2}to{opacity:1}}

/* ── POST VIEW ── */
.post-view{max-width:800px;margin:0 auto;padding:120px 40px 100px}
.back-btn{font-family:var(--fm);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:8px;margin-bottom:48px;transition:color .2s;padding:0}
.back-btn:hover{color:var(--cyan)}
.pv-emoji{font-size:52px;margin-bottom:24px;display:block}
.pv-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.pv-title{font-family:var(--fd);font-size:clamp(32px,5vw,56px);font-weight:800;letter-spacing:-1px;text-transform:uppercase;color:var(--text);margin-bottom:16px;line-height:1}
.pv-summary{font-size:16px;font-weight:300;color:rgba(232,237,245,.5);line-height:1.8;margin-bottom:32px;border-left:2px solid var(--cyan);padding-left:20px}
.pv-meta{display:flex;gap:20px;margin-bottom:48px;padding-bottom:32px;border-bottom:1px solid rgba(0,200,240,.1)}
.pv-meta span{font-family:var(--fm);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.pv-content{font-size:15px;line-height:1.9;color:rgba(232,237,245,.75)}
.pv-content h2{font-family:var(--fd);font-size:28px;font-weight:800;text-transform:uppercase;color:var(--text);margin:40px 0 16px;letter-spacing:.5px}
.pv-content h3{font-family:var(--fd);font-size:20px;font-weight:700;color:var(--text);margin:28px 0 12px}
.pv-content p{margin-bottom:18px}
.pv-content strong{color:var(--cyan)}
.pv-content code,.pv-content .eq{font-family:var(--fm);font-size:16px;color:var(--cyan);background:rgba(0,200,240,.07);padding:12px 20px;display:block;margin:20px 0;border-left:2px solid var(--cyan)}

/* ── COMMENTS ── */
.pv-comments{margin-top:56px;padding-top:40px;border-top:1px solid rgba(0,200,240,.1)}
.cm-title{font-family:var(--fd);font-size:22px;font-weight:800;text-transform:uppercase;margin-bottom:24px}
.cm-title span{color:var(--cyan)}
.cm-list{margin-bottom:40px}
.cm-empty{font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--muted);padding:16px 0}
.cm-item{padding:20px 24px;background:var(--deep);border:1px solid rgba(0,200,240,.07);margin-bottom:10px;border-left:2px solid var(--cyanM)}
.cm-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.cm-name{font-family:var(--fd);font-size:13px;font-weight:700;text-transform:uppercase;color:var(--cyan)}
.cm-date{font-family:var(--fm);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);flex-shrink:0}
.cm-body{font-size:14px;line-height:1.8;color:rgba(232,237,245,.7)}
.cm-foot{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.cm-foot .like-btn{padding:5px 11px;font-size:10px}
.cm-reply-btn{font-family:var(--fm);font-size:10px;letter-spacing:1px;text-transform:uppercase;background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 6px;transition:color .2s}
.cm-reply-btn:hover{color:var(--cyan)}
.cm-item.cm-reply{margin-left:30px;margin-bottom:6px;border-left:2px solid rgba(0,200,240,.28);background:rgba(9,14,24,.6)}
.cm-reply-form{margin-top:12px;padding:16px 18px;background:var(--void);border:1px solid rgba(0,200,240,.12)}
.cm-reply-form .cm-input{margin-bottom:8px;padding:9px 12px;font-size:13px}
.cm-reply-form .cm-text{min-height:64px}
.cm-reply-form .cm-btn{padding:10px 18px;font-size:10px}
.cm-reply-form .cm-status{margin-top:8px;font-size:9px}
.cm-form{background:var(--deep);border:1px solid rgba(0,200,240,.1);padding:28px;position:relative}
.cm-form::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--cyan),transparent)}
.cm-form-head{font-family:var(--fd);font-size:16px;font-weight:800;text-transform:uppercase;margin-bottom:20px}
.cm-input{width:100%;background:var(--void);border:1px solid rgba(0,200,240,.15);color:var(--text);font-family:var(--fb);font-size:14px;padding:12px 16px;margin-bottom:12px;transition:border-color .2s}
.cm-input:focus{outline:none;border-color:var(--cyan)}
.cm-text{min-height:110px;resize:vertical}
.cm-input.hp{position:absolute;left:-9999px;opacity:0;height:0;padding:0;border:0;margin:0}
.cm-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cm-btn{font-family:var(--fm);font-size:11px;letter-spacing:3px;text-transform:uppercase;background:var(--cyan);color:var(--void);border:none;padding:14px 28px;cursor:pointer;font-weight:700;transition:opacity .2s}
.cm-btn:hover{opacity:.85}
.cm-status{font-family:var(--fm);font-size:10px;letter-spacing:1px;margin-top:12px;min-height:16px;color:var(--muted)}
.cm-status.ok{color:var(--green)}
.cm-status.err{color:var(--red)}

/* ── CARD STATS & INLINE COMMENTS ── */
.post-stats{display:flex;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(0,200,240,.08)}
.like-btn,.cm-toggle{font-family:var(--fm);font-size:11px;letter-spacing:1px;background:rgba(0,200,240,.06);border:1px solid rgba(0,200,240,.2);color:var(--muted);padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.like-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.like-btn.liked{background:rgba(0,200,240,.14);border-color:var(--cyan);color:var(--cyan)}
.like-btn.liked .lb-ic{color:var(--red)}
.lb-ic{color:var(--muted)}
.lb-n{color:var(--cyan);font-style:normal}
.cm-toggle:hover{border-color:var(--cyan);color:var(--cyan)}
.cm-toggle b{color:var(--cyan)}
.card-comments{margin-top:16px;padding-top:16px;border-top:1px dashed rgba(0,200,240,.15)}
.card-comments .cm-list{margin-bottom:16px}
.pv-stats{display:flex;gap:10px;margin:18px 0}
.pv-stats .like-btn,.pv-stats .cm-toggle{padding:10px 18px}

/* ── ADMIN VIEW ── */
.admin-wrap{max-width:900px;margin:0 auto;padding:120px 40px 100px}
.admin-title{font-family:var(--fd);font-size:36px;font-weight:800;text-transform:uppercase;margin-bottom:8px}
.admin-sub{font-family:var(--fm);font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:40px}
.admin-posts{margin-bottom:40px}
.ap-item{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;background:var(--deep);border:1px solid rgba(0,200,240,.08);margin-bottom:3px;transition:border-color .2s}
.ap-item:hover{border-color:rgba(0,200,240,.2)}
.ap-title{font-family:var(--fd);font-size:15px;font-weight:700;text-transform:uppercase}
.ap-status{font-family:var(--fm);font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;border:1px solid}
.ap-status.pub{color:var(--green);border-color:rgba(0,240,160,.25)}
.ap-status.draft{color:var(--muted);border-color:rgba(122,147,168,.2)}
.ap-actions{display:flex;gap:8px}
.ap-btn{font-family:var(--fm);font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:6px 12px;border:1px solid;background:none;cursor:pointer;transition:all .2s}
.ap-btn.pub{color:var(--green);border-color:rgba(0,240,160,.2)}
.ap-btn.pub:hover{background:rgba(0,240,160,.1)}
.ap-btn.del{color:var(--red);border-color:rgba(255,68,102,.2)}
.ap-btn.del:hover{background:rgba(255,68,102,.1)}

/* FORM */
.form-section{background:var(--deep);border:1px solid rgba(0,200,240,.1);padding:32px;position:relative}
.form-section::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--cyan),transparent)}
.form-title{font-family:var(--fd);font-size:20px;font-weight:800;text-transform:uppercase;margin-bottom:24px}
.fgroup{margin-bottom:18px}
.flbl{font-family:var(--fm);font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:7px;display:block}
.finput{width:100%;background:var(--void);border:1px solid rgba(0,200,240,.15);color:var(--text);font-family:var(--fb);font-size:14px;padding:12px 16px;transition:border-color .2s}
.finput:focus{outline:none;border-color:var(--cyan)}
textarea.finput{min-height:200px;resize:vertical;font-family:var(--fm);font-size:13px;line-height:1.7}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn{font-family:var(--fm);font-size:10px;letter-spacing:2px;text-transform:uppercase;border:none;cursor:pointer;padding:12px 24px;transition:opacity .2s,transform .15s}
.btn:hover{opacity:.85;transform:translateY(-1px)}
.btn-p{background:var(--cyan);color:var(--void);font-weight:700}
.btn-g{background:transparent;color:var(--text);border:1px solid var(--subtle)}
.btn-g:hover{border-color:var(--cyanM);color:var(--cyan)}
.fstatus{font-family:var(--fm);font-size:11px;letter-spacing:1px;margin-top:12px;min-height:16px}
.fstatus.ok{color:var(--green)}.fstatus.err{color:var(--red)}

/* FOOTER */
footer{background:var(--deep);border-top:1px solid rgba(0,200,240,.07);padding:36px 0;position:relative;z-index:1}
.fi{max-width:1200px;margin:0 auto;padding:0 40px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
.fl{font-family:var(--fd);font-size:14px;font-weight:800;letter-spacing:4px;text-transform:uppercase;color:var(--muted);text-decoration:none}
.fl em{color:var(--cyan);font-style:normal}
.fc{font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--muted)}

/* RESPONSIVE */
@media(max-width:900px){
  .ni{padding:0 20px}
  .blog-list,.post-view,.admin-wrap{padding-left:20px;padding-right:20px}
  .posts-grid{grid-template-columns:1fr}
  .frow{grid-template-columns:1fr}
  .fi{padding:0 20px}
  .blog-hero{padding:120px 20px 40px}
}
/* ══ Cookie Consent (KVKK) ══ */
.qc-cookie{position:fixed;left:0;right:0;bottom:0;z-index:9999;background:rgba(4,10,20,.97);border-top:1px solid rgba(0,200,240,.25);padding:18px 24px;display:none}
.qc-cookie.show{display:block}
.qc-inner{max-width:1100px;margin:0 auto;display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.qc-text{flex:1 1 480px;font-family:var(--fb);font-size:13px;line-height:1.6;color:var(--muted)}
.qc-text strong{color:var(--text);font-family:var(--fd)}
.qc-btns{display:flex;gap:12px;flex-wrap:wrap}
.qc-btn{border:none;cursor:pointer;font-family:var(--fm);font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:12px 22px;transition:opacity .2s}
.qc-btn:hover{opacity:.8}
.qc-accept{background:var(--cyan);color:#020810;font-weight:700}
.qc-reject{background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,.18)}

/* ══ Share + Related ══ */
.pv-share{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0 6px}
.share-btn{font-family:var(--fm);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);
  background:rgba(0,200,240,.04);border:1px solid rgba(0,200,240,.14);padding:9px 14px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px}
.share-btn:hover{color:var(--cyan);border-color:rgba(0,200,240,.4);box-shadow:0 0 12px rgba(0,200,240,.12)}
.share-btn .ic{font-size:13px}
.share-btn .ck{font-size:9px;letter-spacing:2px;color:var(--green)}
.share-card{display:inline-flex;align-items:center;gap:6px;font-family:var(--fm);font-size:9px;letter-spacing:1px;text-transform:uppercase;
  color:var(--muted);background:rgba(0,200,240,.04);border:1px solid rgba(0,200,240,.14);padding:6px 10px;cursor:pointer;transition:all .2s}
.share-card:hover{color:var(--cyan);border-color:rgba(0,200,240,.4)}
.pv-related{margin-top:44px;padding-top:34px;border-top:1px solid rgba(0,200,240,.1)}
.related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.rel-card{background:var(--deep);border:1px solid rgba(0,200,240,.07);padding:22px;cursor:pointer;transition:all .25s;display:flex;flex-direction:column;gap:10px}
.rel-card:hover{border-color:rgba(0,200,240,.3);transform:translateY(-3px)}
.rel-emoji{font-size:22px}
.rel-title{font-family:var(--fd);font-size:13px;font-weight:700;text-transform:uppercase;line-height:1.4;color:var(--text)}
.rel-meta{font-family:var(--fm);font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-top:auto}
@media(max-width:768px){.related-grid{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.related-grid{grid-template-columns:1fr}}

<!-- NAV -->

    <a href="index.html" class="nl">Q<em>U</em>ANTRO</a>
    <div class="nav-right">
      <a href="index.html" class="nb">← Ana Sayfa</a>
      
    </div>

<!-- LIST VIEW -->
<div class="view active" id="view-list">
  <div class="blog-hero">
    <div class="blog-ey"><span>Quantro · Araştırma Blogu</span></div>
    <h1 class="blog-h1">ARAŞTIRMA<br><span class="o">BLOGU</span></h1>

  <div class="post-view">
    <button class="back-btn" onclick="showList()">← Tüm Yazılar</button>
    <span class="pv-emoji" id="pv-emoji"></span>

    <!-- COMMENTS -->

<script>
const SB_URL='https://mzlludkzkddxbbcrjmfu.supabase.co';
const SB_KEY='sb_publishable_MsSvoJUyhPO8HJ4d3FFBdg_bnw1D3BD';

/* NAV */
window.addEventListener('scroll',()=>document.getElementById('nav').classList.toggle('sc',scrollY>60),{passive:true});

/* VIEWS */
let allPosts=[];
function showView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+id).classList.add('active');
  window.scrollTo(0,0);
}
function showList(){
  try{history.replaceState(null,'',location.pathname)}catch(e){}
  showView('list');
}

/* FETCH POSTS */
const SBH={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};
let stats={comments:{},likes:{}};

async function fetchCounts(){
  try{
    const [c,l]=await Promise.all([
      fetch(`${SB_URL}/rest/v1/blog_comments?is_approved=eq.true&select=post_slug`,{headers:SBH}).then(r=>r.json()),
      fetch(`${SB_URL}/rest/v1/post_likes?select=post_slug,likes`,{headers:SBH}).then(r=>r.json())
    ]);
    stats.comments={};
    (Array.isArray(c)?c:[]).forEach(x=>stats.comments[x.post_slug]=(stats.comments[x.post_slug]||0)+1);
    stats.likes={};
    (Array.isArray(l)?l:[]).forEach(x=>stats.likes[x.post_slug]=x.likes);
    applyCounts();
    const pv=document.getElementById('pv-cm-n');
    if(pv&&currentSlug)pv.textContent=stats.comments[currentSlug]||0;
    const pvLb=document.getElementById('pv-like')&&document.getElementById('pv-like').querySelector('.lb-n');
    if(pvLb&&currentSlug)pvLb.textContent=stats.likes[currentSlug]||0;
  }catch(e){}
}

function applyCounts(){
  document.querySelectorAll('.post-card').forEach(card=>{
    const lbBtn=card.querySelector('.like-btn');
    const key=lbBtn&&lbBtn.getAttribute('data-slug');
    if(!key)return;
    const lb=card.querySelector('.like-btn .lb-n');
    if(lb)lb.textContent=stats.likes[key]||0;
    const cn=card.querySelector('.cm-n');
    if(cn)cn.textContent=stats.comments[key]||0;
    setLiked(lbBtn,key);
  });
}

function setLiked(btn,slug){
  if(!btn)return;
  const has=likeStored(likeKey(slug));
  if(has){btn.classList.add('liked');const ic=btn.querySelector('.lb-ic');if(ic)ic.textContent='♥'}
}

function likeKey(s){return 'qlk_'+s.replace(/[^a-z0-9_\-]/gi,'_')}
function likeStored(k){return !!(document.cookie.match(new RegExp('(^|;)\\s*'+k+'='))||(function(){try{return localStorage.getItem(k)==='1'}catch(e){return false}})())}
function setLikeStored(k,on){try{if(on)localStorage.setItem(k,'1');else localStorage.removeItem(k)}catch(e){}document.cookie=k+(on?'=1;max-age=31536000;path=/':'=;max-age=0;path=/')}

let likeLock={};
async function likePost(slug,btn,ev){
  if(ev)ev.stopPropagation();
  if(!btn||likeLock[slug])return;
  const ck=likeKey(slug);
  const liked=likeStored(ck);
  likeLock[slug]=true;
  const ic=btn.querySelector('.lb-ic'),n=btn.querySelector('.lb-n');
  const old=stats.likes[slug]||0;
  if(liked){
    btn.classList.remove('liked');if(ic)ic.textContent='♡';
    stats.likes[slug]=Math.max(0,old-1);
  }else{
    btn.classList.add('liked');if(ic)ic.textContent='♥';
    stats.likes[slug]=old+1;
  }
  if(n)n.textContent=stats.likes[slug];
  if(slug===currentSlug)applyCounts();
  try{
    const res=await fetch('/api/likes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({post_slug:slug,action:liked?'unlike':'like'})});
    const d=await res.json().catch(()=>({}));
    if(res.ok&&d.likes!==undefined){
      stats.likes[slug]=d.likes;
      if(n)n.textContent=d.likes;
      if(d.liked!==undefined){
        if(d.liked){btn.classList.add('liked');if(ic)ic.textContent='♥';setLikeStored(ck,true)}
        else{btn.classList.remove('liked');if(ic)ic.textContent='♡';setLikeStored(ck,false)}
      }
      if(slug===currentSlug)applyCounts();
    }else{
      stats.likes[slug]=old;if(n)n.textContent=old;
      if(liked){btn.classList.add('liked');if(ic)ic.textContent='♥';setLikeStored(ck,true)}
      else{btn.classList.remove('liked');if(ic)ic.textContent='♡';setLikeStored(ck,false)}
    }
  }catch(e){}
  finally{likeLock[slug]=false}
}

function toggleCardComments(slug,ev){
  if(ev)ev.stopPropagation();
  const box=document.getElementById('cms-'+slug);
  if(!box)return;
  const open=box.style.display!=='none';
  box.style.display=open?'none':'block';
  if(!open)loadCardComments(slug);
}

async function loadCardComments(slug){
  const list=document.getElementById('cml-'+slug);
  if(!list||list.getAttribute('data-loaded'))return;
  list.setAttribute('data-loaded','1');
  try{
    const res=await fetch(`${SB_URL}/rest/v1/blog_comments?post_slug=eq.${encodeURIComponent(slug)}&is_approved=eq.true&order=created_at.asc`,{headers:SBH});
    const data=await res.json();
    const arr=Array.isArray(data)?data:[];
    list.innerHTML=renderCommentTree(arr,slug);
    const n=document.getElementById('cms-'+slug)&&document.getElementById('cms-'+slug).querySelector('.cm-n');
    if(n)n.textContent=arr.length;
    stats.comments[slug]=arr.length;
  }catch(e){
    list.innerHTML='<div class="cm-empty">Yorumlar yüklenemedi</div>';
  }
}

async function submitCardComment(slug){
  const g=id=>document.getElementById(id);
  const name=g('cn-'+slug).value.trim();
  const email=g('ce-'+slug).value.trim();
  const content=g('ct-'+slug).value.trim();
  const website=g('cw-'+slug).value;
  const status=g('cs-'+slug);
  const btn=g('cb-'+slug);
  if(!name||content.length<3){status.textContent='Adınızı ve en az 3 karakterlik bir yorum girin.';status.className='cm-status err';return}
  status.textContent='Gönderiliyor…';status.className='cm-status';
  try{
    const res=await fetch('/api/comments',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({post_slug:slug,name,email,content,website})
    });
    if(res.ok){
      g('ct-'+slug).value='';
      g('ce-'+slug).value='';
      status.textContent='✓ Yorumunuz alındı, onay sonrası yayınlanacak.';status.className='cm-status ok';
      try{if(window.gtag)gtag('event','blog_comment_submit',{post:slug})}catch(e){}
    }else if(res.status===429){
      status.textContent='Çok fazla yorum gönderdiniz. 15 dakika sonra tekrar deneyin.';status.className='cm-status err';
    }else{
      status.textContent='Yorum gönderilemedi. Lütfen tekrar deneyin.';status.className='cm-status err';
    }
  }catch(e){
    status.textContent='Sunucuya ulaşılamadı.';status.className='cm-status err';
  }
}

async function fetchPosts(){
  try{
    const res=await fetch(`${SB_URL}/rest/v1/blog_posts?published=eq.true&order=created_at.desc`,{
      headers:SBH
    });
    const data=await res.json();
    allPosts=data||[];
    renderPosts(allPosts);
    renderFilters(allPosts);
    fetchCounts();
    const h=(location.hash||'').slice(1);
    if(h&&allPosts.some(p=>p.slug===h))openPost(h);
  }catch(e){
    document.getElementById('posts-grid').innerHTML='<div class="loading">Yazılar yüklenemedi</div>';
  }
}

function renderPosts(posts){
  const grid=document.getElementById('posts-grid');
  if(!posts.length){grid.innerHTML='<div class="loading">Henüz yazı yok</div>';return}
  grid.innerHTML=posts.map(p=>{
    const s=p.slug;
    return `
    <div class="post-card" onclick="openPost('${s}')">
      <span class="post-emoji">${p.cover_emoji||'⚛'}</span>
      <div class="post-tags">${(p.tags||[]).map(t=>`<span class="ptag">${t}</span>`).join('')}</div>
      <div class="post-title">${p.title}</div>
      <div class="post-summary">${p.summary}</div>
      <div class="post-meta">
        <span class="post-date">${new Date(p.created_at).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})}</span>
        <span class="post-read">${Math.ceil(p.content.split(' ').length/200)} dk okuma →</span>
      </div>
      <div class="post-stats">
        <button class="like-btn" data-slug="${s}" onclick="likePost('${s}',this,event)"><span class="lb-ic">♡</span> <b class="lb-n">0</b></button>
        <button class="cm-toggle" data-slug="${s}" onclick="toggleCardComments('${s}',event)"><span>💬</span> <b class="cm-n">0</b> <span class="cm-lbl">Yorum</span></button>
        <button class="share-card" onclick="sharePostCard('${s}',event)" title="Paylaş"><span>🔗</span> <span class="sc-lbl">Paylaş</span></button>
      </div>
      <div class="card-comments" id="cms-${s}" style="display:none" onclick="event.stopPropagation()">
        <div class="cm-list" id="cml-${s}"><div class="cm-empty">Yorumlar yükleniyor…</div></div>
        <div class="cm-form">
          <div class="cm-form-head">Yorum Yap</div>
          <div class="cm-row">
            <input class="cm-input" id="cn-${s}" placeholder="Adınız *" maxlength="80" autocomplete="name">
            <input class="cm-input" id="ce-${s}" placeholder="E-posta (isteğe bağlı)" maxlength="254" autocomplete="email">
          </div>
          <input class="cm-input hp" id="cw-${s}" tabindex="-1" autocomplete="off" aria-hidden="true">
          <textarea class="cm-input cm-text" id="ct-${s}" placeholder="Yorumunuz… *" maxlength="1200"></textarea>
          <button class="cm-btn" onclick="submitCardComment('${s}')">Gönder</button>
          <div class="cm-status" id="cs-${s}"></div>
        </div>
      </div>
    </div>`;
  }).join('');
  applyCounts();
}

function renderFilters(posts){
  const tags=[...new Set(posts.flatMap(p=>p.tags||[]))];
  const bar=document.getElementById('filter-bar');
  bar.innerHTML=`<button class="ftag active" onclick="filterPosts('',this)">Tümü</button>`+
    tags.map(t=>`<button class="ftag" onclick="filterPosts('${t}',this)">${t}</button>`).join('');
}

let currentTag='';
let activeBtn=null;
function filterPosts(tag,btn){
  currentTag=tag;
  if(btn){activeBtn=btn;document.querySelectorAll('.ftag').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
  const q=(document.getElementById('search-input').value||'').toLowerCase().trim();
  let list=allPosts;
  if(tag)list=list.filter(p=>(p.tags||[]).includes(tag));
  if(q)list=list.filter(p=>{
    const hay=(p.title+' '+(p.summary||'')+' '+(p.tags||[]).join(' ')).toLowerCase();
    return hay.includes(q);
  });
  renderPosts(list);
}

/* OPEN POST */
let currentSlug='';
function openPost(slug){
  const p=allPosts.find(x=>x.slug===slug);
  if(!p)return;
  try{if(window.gtag)gtag('event','blog_open',{post:slug,title:p.title})}catch(e){}
  document.getElementById('pv-emoji').textContent=p.cover_emoji||'⚛';
  document.getElementById('pv-tags').innerHTML=(p.tags||[]).map(t=>`<span class="ptag">${t}</span>`).join('');
  document.getElementById('pv-title').textContent=p.title;
  document.getElementById('pv-summary').textContent=p.summary;
  document.getElementById('pv-date').textContent=new Date(p.created_at).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});
  document.getElementById('pv-readtime').textContent=Math.ceil(p.content.split(' ').length/200)+' dakika okuma';
  document.getElementById('pv-content').innerHTML=mdToHtml(p.content);
  document.getElementById('cm-status').textContent='';
  const pvN=document.getElementById('pv-cm-n');
  if(pvN)pvN.textContent=stats.comments[slug]||0;
  setLiked(document.getElementById('pv-like'),slug);
  const pvLb=document.getElementById('pv-like')&&document.getElementById('pv-like').querySelector('.lb-n');
  if(pvLb)pvLb.textContent=stats.likes[slug]||0;
  renderShare();
  renderRelated(p);
  currentSlug=slug;
  try{history.replaceState(null,'','#'+slug)}catch(e){}
  showView('post');
  loadComments(slug);
}

/* SHARE */
function postUrl(){
  return location.origin+location.pathname+'#'+currentSlug;
}
function renderShare(){
  const box=document.getElementById('pv-share');
  const title=document.getElementById('pv-title').textContent;
  const u=postUrl();
  box.innerHTML=`
    <button class="share-btn" onclick="shareX()"><span class="ic">𝕏</span> Paylaş</button>
    <button class="share-btn" onclick="shareWA()"><span class="ic">✆</span> WhatsApp</button>
    <button class="share-btn" onclick="shareCopy(this)"><span class="ic">🔗</span> Kopyala</button>`;
}
function shareX(){
  const t=document.getElementById('pv-title').textContent;
  window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(t+' — Quantro Araştırma Blogu')+'&url='+encodeURIComponent(postUrl()),'_blank','width=600,height=520,noopener');
}
function shareWA(){
  const t=document.getElementById('pv-title').textContent;
  window.open('https://wa.me/?text='+encodeURIComponent(t+' — '+postUrl()),'_blank','noopener');
}
function shareCopy(btn){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(postUrl()).then(()=>{
      const old=btn.innerHTML;
      btn.innerHTML='<span class="ck">✓ Kopyalandı</span>';
      setTimeout(()=>{btn.innerHTML=old},1600);
    });
  }
}

function sharePostCard(slug,ev){
  if(ev)ev.stopPropagation();
  const p=allPosts.find(x=>x.slug===slug);
  const u=location.origin+location.pathname+'#'+slug;
  const text=(p&&p.title?p.title:'Quantro')+' — Quantro Araştırma Blogu';
  if(navigator.share){
    navigator.share({title:text,text:text,url:u}).catch(()=>{});
    return;
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(u).then(()=>{
      const b=ev.target.closest('.share-card');
      if(b){const old=b.innerHTML;b.innerHTML='<span>✓</span> <span class="sc-lbl">Kopyalandı</span>';setTimeout(()=>{b.innerHTML=old},1400)}
    });
  }
}

/* RELATED */
function renderRelated(cur){
  const box=document.getElementById('pv-related');
  if(!cur||!cur.tags){box.style.display='none';return}
  const rel=allPosts.filter(p=>p.slug!==cur.slug&&(p.tags||[]).some(t=>(cur.tags||[]).includes(t))).slice(0,3);
  if(!rel.length){box.style.display='none';return}
  document.getElementById('related-grid').innerHTML=rel.map(p=>`
    <div class="rel-card" onclick="openPost('${p.slug}')">
      <span class="rel-emoji">${p.cover_emoji||'⚛'}</span>
      <div class="rel-title">${p.title}</div>
      <div class="rel-meta">${Math.ceil(p.content.split(' ').length/200)} dk okuma</div>
    </div>`).join('');
  box.style.display='block';
}

/* COMMENTS */
function escHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function commentLiked(id){return likeStored('qcl_'+id.replace(/[^a-z0-9_\-]/gi,'_'))}

function commentLikeBtn(c){
  const liked=commentLiked(c.id);
  return `<button class="like-btn cmlike" onclick="commentLike('${c.id}',this,event)" title="Beğen"><span class="lb-ic">${liked?'♥':'♡'}</span> <b class="lb-n">${c.likes||0}</b></button>`;
}

function commentItemHTML(c,slug,isReply){
  const cls=isReply?'cm-item cm-reply':'cm-item';
  return `
  <div class="${cls}" id="cm-${c.id}">
    <div class="cm-head">
      <span class="cm-name">${escHtml(c.name)}</span>
      <span class="cm-date">${new Date(c.created_at).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})}</span>
    </div>
    <div class="cm-body">${escHtml(c.content).replace(/\n/g,'<br>')}</div>
    <div class="cm-foot">
      ${commentLikeBtn(c)}
      <button class="cm-reply-btn" onclick="toggleReply('${c.id}',event)">↩ Yanıtla</button>
    </div>
    <div class="cm-reply-form" id="crf-${c.id}" style="display:none">
      <div class="cm-row">
        <input class="cm-input" id="crn-${c.id}" placeholder="Adınız *" maxlength="80" autocomplete="name">
        <input class="cm-input" id="cre-${c.id}" placeholder="E-posta (isteğe bağlı)" maxlength="254" autocomplete="email">
      </div>
      <input class="cm-input hp" id="crw-${c.id}" tabindex="-1" autocomplete="off" aria-hidden="true">
      <textarea class="cm-input cm-text" id="crt-${c.id}" placeholder="Yanıtınız… *" maxlength="1200"></textarea>
      <button class="cm-btn" onclick="submitReply('${c.id}','${slug}',event)">Gönder</button>
      <div class="cm-status" id="crs-${c.id}"></div>
    </div>
  </div>`;
}

function renderCommentTree(arr,slug){
  if(!Array.isArray(arr)||!arr.length)return '<div class="cm-empty">Henüz yorum yok. İlk yorumu sen yap!</div>';
  const byParent={};
  arr.forEach(c=>{const k=c.parent_id||'root';(byParent[k]=byParent[k]||[]).push(c)});
  const roots=byParent['root']||[];
  if(!roots.length)return '<div class="cm-empty">Henüz yorum yok. İlk yorumu sen yap!</div>';
  return roots.map(c=>commentItemHTML(c,slug,false)+((byParent[c.id]||[]).map(r=>commentItemHTML(r,slug,true)).join(''))).join('');
}

let commentLikeLock={};
async function commentLike(id,btn,ev){
  if(ev)ev.stopPropagation();
  if(!btn||commentLikeLock[id])return;
  const ck='qcl_'+id.replace(/[^a-z0-9_\-]/gi,'_');
  const liked=likeStored(ck);
  commentLikeLock[id]=true;
  const ic=btn.querySelector('.lb-ic'),n=btn.querySelector('.lb-n');
  const old=parseInt((n&&n.textContent)||'0',10)||0;
  if(liked){btn.classList.remove('liked');if(ic)ic.textContent='♡';}
  else{btn.classList.add('liked');if(ic)ic.textContent='♥';}
  if(n)n.textContent=liked?Math.max(0,old-1):old+1;
  try{
    const res=await fetch('/api/comment-likes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({comment_id:id,action:liked?'unlike':'like'})});
    const d=await res.json().catch(()=>({}));
    if(res.ok&&d.likes!==undefined){
      if(n)n.textContent=d.likes;
      if(d.liked!==undefined){
        if(d.liked){btn.classList.add('liked');if(ic)ic.textContent='♥';setLikeStored(ck,true)}
        else{btn.classList.remove('liked');if(ic)ic.textContent='♡';setLikeStored(ck,false)}
      }
    }else{
      if(n)n.textContent=old;
      if(liked){btn.classList.add('liked');if(ic)ic.textContent='♥';setLikeStored(ck,true)}
      else{btn.classList.remove('liked');if(ic)ic.textContent='♡';setLikeStored(ck,false)}
    }
  }catch(e){}
  finally{commentLikeLock[id]=false}
}

function toggleReply(id,ev){
  if(ev)ev.stopPropagation();
  const f=document.getElementById('crf-'+id);
  if(f)f.style.display=f.style.display==='none'?'block':'none';
}

async function submitReply(parentId,slug,ev){
  if(ev)ev.stopPropagation();
  const g=id=>document.getElementById(id);
  const name=g('crn-'+parentId).value.trim();
  const email=g('cre-'+parentId).value.trim();
  const content=g('crt-'+parentId).value.trim();
  const website=g('crw-'+parentId).value;
  const status=g('crs-'+parentId);
  if(!name||content.length<3){status.textContent='Adınızı ve en az 3 karakterlik bir yanıt girin.';status.className='cm-status err';return}
  status.textContent='Gönderiliyor…';status.className='cm-status';
  try{
    const res=await fetch('/api/comments',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({post_slug:slug,parent_id:parentId,name,email,content,website})
    });
    if(res.ok){
      g('crt-'+parentId).value='';
      g('cre-'+parentId).value='';
      status.textContent='✓ Yanıtınız alındı, onay sonrası yayınlanacak.';status.className='cm-status ok';
      const f=g('crf-'+parentId);if(f)f.style.display='none';
    }else if(res.status===429){
      status.textContent='Çok fazla yorum gönderdiniz. 15 dakika sonra tekrar deneyin.';status.className='cm-status err';
    }else{
      status.textContent='Yanıt gönderilemedi. Lütfen tekrar deneyin.';status.className='cm-status err';
    }
  }catch(e){
    status.textContent='Sunucuya ulaşılamadı.';status.className='cm-status err';
  }
}

async function loadComments(slug){
  const list=document.getElementById('cm-list');
  const count=document.getElementById('cm-count');
  try{
    const res=await fetch(`${SB_URL}/rest/v1/blog_comments?post_slug=eq.${encodeURIComponent(slug)}&is_approved=eq.true&order=created_at.asc`,{
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
    });
    const data=await res.json();
    const arr=Array.isArray(data)?data:[];
    count.textContent=`(${arr.length})`;
    stats.comments[slug]=arr.length;
    const pvN=document.getElementById('pv-cm-n');
    if(pvN&&slug===currentSlug)pvN.textContent=arr.length;
    applyCounts();
    list.innerHTML=renderCommentTree(arr,slug);
  }catch(e){
    count.textContent='';
    list.innerHTML='<div class="cm-empty">Yorumlar yüklenemedi</div>';
  }
}

async function submitComment(){
  const name=document.getElementById('cm-name').value.trim();
  const email=document.getElementById('cm-email').value.trim();
  const content=document.getElementById('cm-content').value.trim();
  const website=document.getElementById('cm-website').value;
  const status=document.getElementById('cm-status');
  const btn=document.getElementById('cm-submit');
  if(!name||content.length<3){status.textContent='Adınızı ve en az 3 karakterlik bir yorum girin.';status.className='cm-status err';return}
  status.textContent='Gönderiliyor…';status.className='cm-status';
  btn.disabled=true;
  try{
    const res=await fetch('/api/comments',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({post_slug:currentSlug,name,email,content,website})
    });
    if(res.ok){
      document.getElementById('cm-content').value='';
      document.getElementById('cm-email').value='';
      status.textContent='✓ Yorumunuz alındı, onay sonrası yayınlanacak.';status.className='cm-status ok';
      try{if(window.gtag)gtag('event','blog_comment_submit',{post:currentSlug})}catch(e){}
    }else if(res.status===429){
      status.textContent='Çok fazla yorum gönderdiniz. 15 dakika sonra tekrar deneyin.';status.className='cm-status err';
    }else{
      status.textContent='Yorum gönderilemedi. Lütfen tekrar deneyin.';status.className='cm-status err';
    }
  }catch(e){
    status.textContent='Sunucuya ulaşılamadı.';status.className='cm-status err';
  }finally{
    btn.disabled=false;
  }
}

/* SIMPLE MARKDOWN PARSER */
function mdToHtml(md){
  return md
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/^([A-Za-z_ÇĞİÖŞÜçğışöşü].+=.+)$/gm,'<div class="eq">$1</div>')
    .replace(/\n\n/g,'</p><p>')
    .replace(/^(?!<[h2h3d])/gm,'')
    .split('\n').map(l=>l.startsWith('<')?l:`<p>${l}</p>`).join('');
}
