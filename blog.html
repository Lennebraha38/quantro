<script>
const SB_URL='https://mzlludkzkddxbbcrjmfu.supabase.co';
const SB_KEY='sb_publishable_MsSvoJUyhPO8HJ4d3FFBdg_bnw1D3BD';

/* NAV */
window.addEventListener('scroll',()=>document.getElementById('nav').classList.toggle('sc',scrollY>60),{passive:true});

/* VIEWS */
let allPosts=[];
function showView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+id).classList.add('active');
  window.scrollTo(0,0);
}
function showList(){
  try{history.replaceState(null,'',location.pathname)}catch(e){}
  showView('list');
}

/* FETCH POSTS */
const SBH={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};
let stats={comments:{},likes:{}};

async function fetchCounts(){
  try{
    const [c,l]=await Promise.all([
      fetch(`${SB_URL}/rest/v1/blog_comments?is_approved=eq.true&select=post_slug`,{headers:SBH}).then(r=>r.json()),
      fetch(`${SB_URL}/rest/v1/post_likes?select=post_slug,likes`,{headers:SBH}).then(r=>r.json())
    ]);
    stats.comments={};
    (Array.isArray(c)?c:[]).forEach(x=>stats.comments[x.post_slug]=(stats.comments[x.post_slug]||0)+1);
    stats.likes={};
    (Array.isArray(l)?l:[]).forEach(x=>stats.likes[x.post_slug]=x.likes);
    applyCounts();
    const pv=document.getElementById('pv-cm-n');
    if(pv&&currentSlug)pv.textContent=stats.comments[currentSlug]||0;
    const pvLb=document.getElementById('pv-like')&&document.getElementById('pv-like').querySelector('.lb-n');
    if(pvLb&&currentSlug)pvLb.textContent=stats.likes[currentSlug]||0;
  }catch(e){}
}

function applyCounts(){
  document.querySelectorAll('.post-card').forEach(card=>{
    const lbBtn=card.querySelector('.like-btn');
    const key=lbBtn&&lbBtn.getAttribute('data-slug');
    if(!key)return;
    const lb=card.querySelector('.like-btn .lb-n');
    if(lb)lb.textContent=stats.likes[key]||0;
    const cn=card.querySelector('.cm-n');
    if(cn)cn.textContent=stats.comments[key]||0;
    setLiked(lbBtn,key);
  });
}

function setLiked(btn,slug){
  if(!btn)return;
  const has=likeStored(likeKey(slug));
  if(has){btn.classList.add('liked');const ic=btn.querySelector('.lb-ic');if(ic)ic.textContent='♥'}
}

function likeKey(s){return 'qlk_'+s.replace(/[^a-z0-9_\-]/gi,'_')}
function likeStored(k){return !!(document.cookie.match(new RegExp('(^|;)\\s*'+k+'='))||(function(){try{return localStorage.getItem(k)==='1'}catch(e){return false}})())}
function setLikeStored(k,on){try{if(on)localStorage.setItem(k,'1');else localStorage.removeItem(k)}catch(e){}document.cookie=k+(on?'=1;max-age=31536000;path=/':'=;max-age=0;path=/')}

let likeLock={};
async function likePost(slug,btn,ev){
  if(ev)ev.stopPropagation();
  if(!btn||likeLock[slug])return;
  const ck=likeKey(slug);
  const liked=likeStored(ck);
  likeLock[slug]=true;
  const ic=btn.querySelector('.lb-ic'),n=btn.querySelector('.lb-n');
  const old=stats.likes[slug]||0;
  if(liked){
    btn.classList.remove('liked');if(ic)ic.textContent='♡';
    stats.likes[slug]=Math.max(0,old-1);
  }else{
    btn.classList.add('liked');if(ic)ic.textContent='♥';
    stats.likes[slug]=old+1;
  }
  if(n)n.textContent=stats.likes[slug];
  if(slug===currentSlug)applyCounts();
  try{
    const res=await fetch('/api/likes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({post_slug:slug,action:liked?'unlike':'like'})});
    const d=await res.json().catch(()=>({}));
    if(res.ok&&d.likes!==undefined){
      stats.likes[slug]=d.likes;
      if(n)n.textContent=d.likes;
      if(d.liked!==undefined){
        if(d.liked){btn.classList.add('liked');if(ic)ic.textContent='♥';setLikeStored(ck,true)}
        else{btn.classList.remove('liked');if(ic)ic.textContent='♡';setLikeStored(ck,false)}
      }
      if(slug===currentSlug)applyCounts();
    }else{
      stats.likes[slug]=old;if(n)n.textContent=old;
      if(liked){btn.classList.add('liked');if(ic)ic.textContent='♥';setLikeStored(ck,true)}
      else{btn.classList.remove('liked');if(ic)ic.textContent='♡';setLikeStored(ck,false)}
    }
  }catch(e){}
  finally{likeLock[slug]=false}
}

function toggleCardComments(slug,ev){
  if(ev)ev.stopPropagation();
  const box=document.getElementById('cms-'+slug);
  if(!box)return;
  const open=box.style.display!=='none';
  box.style.display=open?'none':'block';
  if(!open)loadCardComments(slug);
}

async function loadCardComments(slug){
  const list=document.getElementById('cml-'+slug);
  if(!list||list.getAttribute('data-loaded'))return;
  list.setAttribute('data-loaded','1');
  try{
    const res=await fetch(`${SB_URL}/rest/v1/blog_comments?post_slug=eq.${encodeURIComponent(slug)}&is_approved=eq.true&order=created_at.asc`,{headers:SBH});
    const data=await res.json();
    const arr=Array.isArray(data)?data:[];
    list.innerHTML=renderCommentTree(arr,slug);
    const n=document.getElementById('cms-'+slug)&&document.getElementById('cms-'+slug).querySelector('.cm-n');
    if(n)n.textContent=arr.length;
    stats.comments[slug]=arr.length;
  }catch(e){
    list.innerHTML='<div class="cm-empty">Yorumlar yüklenemedi</div>';
  }
}

async function submitCardComment(slug){
  const g=id=>document.getElementById(id);
  const name=g('cn-'+slug).value.trim();
  const email=g('ce-'+slug).value.trim();
  const content=g('ct-'+slug).value.trim();
  const website=g('cw-'+slug).value;
  const status=g('cs-'+slug);
  const btn=g('cb-'+slug);
  if(!name||content.length<3){status.textContent='Adınızı ve en az 3 karakterlik bir yorum girin.';status.className='cm-status err';return}
  status.textContent='Gönderiliyor…';status.className='cm-status';
  try{
    const res=await fetch('/api/comments',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({post_slug:slug,name,email,content,website})
    });
    if(res.ok){
      g('ct-'+slug).value='';
      g('ce-'+slug).value='';
      status.textContent='✓ Yorumunuz alındı, onay sonrası yayınlanacak.';status.className='cm-status ok';
      try{if(window.gtag)gtag('event','blog_comment_submit',{post:slug})}catch(e){}
    }else if(res.status===429){
      status.textContent='Çok fazla yorum gönderdiniz. 15 dakika sonra tekrar deneyin.';status.className='cm-status err';
    }else{
      status.textContent='Yorum gönderilemedi. Lütfen tekrar deneyin.';status.className='cm-status err';
    }
  }catch(e){
    status.textContent='Sunucuya ulaşılamadı.';status.className='cm-status err';
  }
}

async function fetchPosts(){
  try{
    const res=await fetch(`${SB_URL}/rest/v1/blog_posts?published=eq.true&order=created_at.desc`,{
      headers:SBH
    });
    const data=await res.json();
    allPosts=data||[];
    renderPosts(allPosts);
    renderFilters(allPosts);
    fetchCounts();
    const h=(location.hash||'').slice(1);
    if(h&&allPosts.some(p=>p.slug===h))openPost(h);
  }catch(e){
    document.getElementById('posts-grid').innerHTML='<div class="loading">Yazılar yüklenemedi</div>';
  }
}

function renderPosts(posts){
  const grid=document.getElementById('posts-grid');
  if(!posts.length){grid.innerHTML='<div class="loading">Henüz yazı yok</div>';return}
  grid.innerHTML=posts.map(p=>{
    const s=p.slug;
    return `
    <div class="post-card" onclick="openPost('${s}')">
      <span class="post-emoji">${p.cover_emoji||'⚛'}</span>
      <div class="post-tags">${(p.tags||[]).map(t=>`<span class="ptag">${t}</span>`).join('')}</div>
      <div class="post-title">${p.title}</div>
      <div class="post-summary">${p.summary}</div>
      <div class="post-meta">
        <span class="post-date">${new Date(p.created_at).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})}</span>
        <span class="post-read">${Math.ceil(p.content.split(' ').length/200)} dk okuma →</span>
      </div>
      <div class="post-stats">
        <button class="like-btn" data-slug="${s}" onclick="likePost('${s}',this,event)"><span class="lb-ic">♡</span> <b class="lb-n">0</b></button>
        <button class="cm-toggle" data-slug="${s}" onclick="toggleCardComments('${s}',event)"><span>💬</span> <b class="cm-n">0</b> <span class="cm-lbl">Yorum</span></button>
        <button class="share-card" onclick="sharePostCard('${s}',event)" title="Paylaş"><span>🔗</span> <span class="sc-lbl">Paylaş</span></button>
      </div>
      <div class="card-comments" id="cms-${s}" style="display:none" onclick="event.stopPropagation()">
        <div class="cm-list" id="cml-${s}"><div class="cm-empty">Yorumlar yükleniyor…</div></div>
        <div class="cm-form">
          <div class="cm-form-head">Yorum Yap</div>
          <div class="cm-row">
            <input class="cm-input" id="cn-${s}" placeholder="Adınız *" maxlength="80" autocomplete="name">
            <input class="cm-input" id="ce-${s}" placeholder="E-posta (isteğe bağlı)" maxlength="254" autocomplete="email">
          </div>
          <input class="cm-input hp" id="cw-${s}" tabindex="-1" autocomplete="off" aria-hidden="true">
          <textarea class="cm-input cm-text" id="ct-${s}" placeholder="Yorumunuz… *" maxlength="1200"></textarea>
          <button class="cm-btn" onclick="submitCardComment('${s}')">Gönder</button>
          <div class="cm-status" id="cs-${s}"></div>
        </div>
      </div>
    </div>`;
  }).join('');
  applyCounts();
}

function renderFilters(posts){
  const tags=[...new Set(posts.flatMap(p=>p.tags||[]))];
  const bar=document.getElementById('filter-bar');
  bar.innerHTML=`<button class="ftag active" onclick="filterPosts('',this)">Tümü</button>`+
    tags.map(t=>`<button class="ftag" onclick="filterPosts('${t}',this)">${t}</button>`).join('');
}

let currentTag='';
let activeBtn=null;
function filterPosts(tag,btn){
  currentTag=tag;
  if(btn){activeBtn=btn;document.querySelectorAll('.ftag').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
  const q=(document.getElementById('search-input').value||'').toLowerCase().trim();
  let list=allPosts;
  if(tag)list=list.filter(p=>(p.tags||[]).includes(tag));
  if(q)list=list.filter(p=>{
    const hay=(p.title+' '+(p.summary||'')+' '+(p.tags||[]).join(' ')).toLowerCase();
    return hay.includes(q);
  });
  renderPosts(list);
}

/* OPEN POST */
let currentSlug='';
function openPost(slug){
  const p=allPosts.find(x=>x.slug===slug);
  if(!p)return;
  try{if(window.gtag)gtag('event','blog_open',{post:slug,title:p.title})}catch(e){}
  document.getElementById('pv-emoji').textContent=p.cover_emoji||'⚛';
  document.getElementById('pv-tags').innerHTML=(p.tags||[]).map(t=>`<span class="ptag">${t}</span>`).join('');
  document.getElementById('pv-title').textContent=p.title;
  document.getElementById('pv-summary').textContent=p.summary;
  document.getElementById('pv-date').textContent=new Date(p.created_at).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});
  document.getElementById('pv-readtime').textContent=Math.ceil(p.content.split(' ').length/200)+' dakika okuma';
  document.getElementById('pv-content').innerHTML=mdToHtml(p.content);
  document.getElementById('cm-status').textContent='';
  const pvN=document.getElementById('pv-cm-n');
  if(pvN)pvN.textContent=stats.comments[slug]||0;
  setLiked(document.getElementById('pv-like'),slug);
  const pvLb=document.getElementById('pv-like')&&document.getElementById('pv-like').querySelector('.lb-n');
  if(pvLb)pvLb.textContent=stats.likes[slug]||0;
  renderShare();
  renderRelated(p);
  currentSlug=slug;
  try{history.replaceState(null,'','#'+slug)}catch(e){}
  showView('post');
  loadComments(slug);
}

/* SHARE */
function postUrl(){
  return location.origin+location.pathname+'#'+currentSlug;
}
function renderShare(){
  const box=document.getElementById('pv-share');
  const title=document.getElementById('pv-title').textContent;
  const u=postUrl();
  box.innerHTML=`
    <button class="share-btn" onclick="shareX()"><span class="ic">𝕏</span> Paylaş</button>
    <button class="share-btn" onclick="shareWA()"><span class="ic">✆</span> WhatsApp</button>
    <button class="share-btn" onclick="shareCopy(this)"><span class="ic">🔗</span> Kopyala</button>`;
}
function shareX(){
  const t=document.getElementById('pv-title').textContent;
  window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(t+' — Quantro Araştırma Blogu')+'&url='+encodeURIComponent(postUrl()),'_blank','width=600,height=520,noopener');
}
function shareWA(){
  const t=document.getElementById('pv-title').textContent;
  window.open('https://wa.me/?text='+encodeURIComponent(t+' — '+postUrl()),'_blank','noopener');
}
function shareCopy(btn){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(postUrl()).then(()=>{
      const old=btn.innerHTML;
      btn.innerHTML='<span class="ck">✓ Kopyalandı</span>';
      setTimeout(()=>{btn.innerHTML=old},1600);
    });
  }
}

function sharePostCard(slug,ev){
  if(ev)ev.stopPropagation();
  const p=allPosts.find(x=>x.slug===slug);
  const u=location.origin+location.pathname+'#'+slug;
  const text=(p&&p.title?p.title:'Quantro')+' — Quantro Araştırma Blogu';
  if(navigator.share){
    navigator.share({title:text,text:text,url:u}).catch(()=>{});
    return;
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(u).then(()=>{
      const b=ev.target.closest('.share-card');
      if(b){const old=b.innerHTML;b.innerHTML='<span>✓</span> <span class="sc-lbl">Kopyalandı</span>';setTimeout(()=>{b.innerHTML=old},1400)}
    });
  }
}

/* RELATED */
function renderRelated(cur){
  const box=document.getElementById('pv-related');
  if(!cur||!cur.tags){box.style.display='none';return}
  const rel=allPosts.filter(p=>p.slug!==cur.slug&&(p.tags||[]).some(t=>(cur.tags||[]).includes(t))).slice(0,3);
  if(!rel.length){box.style.display='none';return}
  document.getElementById('related-grid').innerHTML=rel.map(p=>`
    <div class="rel-card" onclick="openPost('${p.slug}')">
      <span class="rel-emoji">${p.cover_emoji||'⚛'}</span>
      <div class="rel-title">${p.title}</div>
      <div class="rel-meta">${Math.ceil(p.content.split(' ').length/200)} dk okuma</div>
    </div>`).join('');
  box.style.display='block';
}

/* COMMENTS */
function escHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function commentLiked(id){return likeStored('qcl_'+id.replace(/[^a-z0-9_\-]/gi,'_'))}

function commentLikeBtn(c){
  const liked=commentLiked(c.id);
  return `<button class="like-btn cmlike" onclick="commentLike('${c.id}',this,event)" title="Beğen"><span class="lb-ic">${liked?'♥':'♡'}</span> <b class="lb-n">${c.likes||0}</b></button>`;
}

function commentItemHTML(c,slug,isReply){
  const cls=isReply?'cm-item cm-reply':'cm-item';
  return `
  <div class="${cls}" id="cm-${c.id}">
    <div class="cm-head">
      <span class="cm-name">${escHtml(c.name)}</span>
      <span class="cm-date">${new Date(c.created_at).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})}</span>
    </div>
    <div class="cm-body">${escHtml(c.content).replace(/\n/g,'<br>')}</div>
    <div class="cm-foot">
      ${commentLikeBtn(c)}
      <button class="cm-reply-btn" onclick="toggleReply('${c.id}',event)">↩ Yanıtla</button>
    </div>
    <div class="cm-reply-form" id="crf-${c.id}" style="display:none">
      <div class="cm-row">
        <input class="cm-input" id="crn-${c.id}" placeholder="Adınız *" maxlength="80" autocomplete="name">
        <input class="cm-input" id="cre-${c.id}" placeholder="E-posta (isteğe bağlı)" maxlength="254" autocomplete="email">
      </div>
      <input class="cm-input hp" id="crw-${c.id}" tabindex="-1" autocomplete="off" aria-hidden="true">
      <textarea class="cm-input cm-text" id="crt-${c.id}" placeholder="Yanıtınız… *" maxlength="1200"></textarea>
      <button class="cm-btn" onclick="submitReply('${c.id}','${slug}',event)">Gönder</button>
      <div class="cm-status" id="crs-${c.id}"></div>
    </div>
  </div>`;
}

function renderCommentTree(arr,slug){
  if(!Array.isArray(arr)||!arr.length)return '<div class="cm-empty">Henüz yorum yok. İlk yorumu sen yap!</div>';
  const byParent={};
  arr.forEach(c=>{const k=c.parent_id||'root';(byParent[k]=byParent[k]||[]).push(c)});
  const roots=byParent['root']||[];
  if(!roots.length)return '<div class="cm-empty">Henüz yorum yok. İlk yorumu sen yap!</div>';
  return roots.map(c=>commentItemHTML(c,slug,false)+((byParent[c.id]||[]).map(r=>commentItemHTML(r,slug,true)).join(''))).join('');
}

let commentLikeLock={};
async function commentLike(id,btn,ev){
  if(ev)ev.stopPropagation();
  if(!btn||commentLikeLock[id])return;
  const ck='qcl_'+id.replace(/[^a-z0-9_\-]/gi,'_');
  const liked=likeStored(ck);
  commentLikeLock[id]=true;
  const ic=btn.querySelector('.lb-ic'),n=btn.querySelector('.lb-n');
  const old=parseInt((n&&n.textContent)||'0',10)||0;
  if(liked){btn.classList.remove('liked');if(ic)ic.textContent='♡';}
  else{btn.classList.add('liked');if(ic)ic.textContent='♥';}
  if(n)n.textContent=liked?Math.max(0,old-1):old+1;
  try{
    const res=await fetch('/api/comment-likes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({comment_id:id,action:liked?'unlike':'like'})});
    const d=await res.json().catch(()=>({}));
    if(res.ok&&d.likes!==undefined){
      if(n)n.textContent=d.likes;
      if(d.liked!==undefined){
        if(d.liked){btn.classList.add('liked');if(ic)ic.textContent='♥';setLikeStored(ck,true)}
        else{btn.classList.remove('liked');if(ic)ic.textContent='♡';setLikeStored(ck,false)}
      }
    }else{
      if(n)n.textContent=old;
      if(liked){btn.classList.add('liked');if(ic)ic.textContent='♥';setLikeStored(ck,true)}
      else{btn.classList.remove('liked');if(ic)ic.textContent='♡';setLikeStored(ck,false)}
    }
  }catch(e){}
  finally{commentLikeLock[id]=false}
}

function toggleReply(id,ev){
  if(ev)ev.stopPropagation();
  const f=document.getElementById('crf-'+id);
  if(f)f.style.display=f.style.display==='none'?'block':'none';
}

async function submitReply(parentId,slug,ev){
  if(ev)ev.stopPropagation();
  const g=id=>document.getElementById(id);
  const name=g('crn-'+parentId).value.trim();
  const email=g('cre-'+parentId).value.trim();
  const content=g('crt-'+parentId).value.trim();
  const website=g('crw-'+parentId).value;
  const status=g('crs-'+parentId);
  if(!name||content.length<3){status.textContent='Adınızı ve en az 3 karakterlik bir yanıt girin.';status.className='cm-status err';return}
  status.textContent='Gönderiliyor…';status.className='cm-status';
  try{
    const res=await fetch('/api/comments',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({post_slug:slug,parent_id:parentId,name,email,content,website})
    });
    if(res.ok){
      g('crt-'+parentId).value='';
      g('cre-'+parentId).value='';
      status.textContent='✓ Yanıtınız alındı, onay sonrası yayınlanacak.';status.className='cm-status ok';
      const f=g('crf-'+parentId);if(f)f.style.display='none';
    }else if(res.status===429){
      status.textContent='Çok fazla yorum gönderdiniz. 15 dakika sonra tekrar deneyin.';status.className='cm-status err';
    }else{
      status.textContent='Yanıt gönderilemedi. Lütfen tekrar deneyin.';status.className='cm-status err';
    }
  }catch(e){
    status.textContent='Sunucuya ulaşılamadı.';status.className='cm-status err';
  }
}

async function loadComments(slug){
  const list=document.getElementById('cm-list');
  const count=document.getElementById('cm-count');
  try{
    const res=await fetch(`${SB_URL}/rest/v1/blog_comments?post_slug=eq.${encodeURIComponent(slug)}&is_approved=eq.true&order=created_at.asc`,{
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
    });
    const data=await res.json();
    const arr=Array.isArray(data)?data:[];
    count.textContent=`(${arr.length})`;
    stats.comments[slug]=arr.length;
    const pvN=document.getElementById('pv-cm-n');
    if(pvN&&slug===currentSlug)pvN.textContent=arr.length;
    applyCounts();
    list.innerHTML=renderCommentTree(arr,slug);
  }catch(e){
    count.textContent='';
    list.innerHTML='<div class="cm-empty">Yorumlar yüklenemedi</div>';
  }
}

async function submitComment(){
  const name=document.getElementById('cm-name').value.trim();
  const email=document.getElementById('cm-email').value.trim();
  const content=document.getElementById('cm-content').value.trim();
  const website=document.getElementById('cm-website').value;
  const status=document.getElementById('cm-status');
  const btn=document.getElementById('cm-submit');
  if(!name||content.length<3){status.textContent='Adınızı ve en az 3 karakterlik bir yorum girin.';status.className='cm-status err';return}
  status.textContent='Gönderiliyor…';status.className='cm-status';
  btn.disabled=true;
  try{
    const res=await fetch('/api/comments',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({post_slug:currentSlug,name,email,content,website})
    });
    if(res.ok){
      document.getElementById('cm-content').value='';
      document.getElementById('cm-email').value='';
      status.textContent='✓ Yorumunuz alındı, onay sonrası yayınlanacak.';status.className='cm-status ok';
      try{if(window.gtag)gtag('event','blog_comment_submit',{post:currentSlug})}catch(e){}
    }else if(res.status===429){
      status.textContent='Çok fazla yorum gönderdiniz. 15 dakika sonra tekrar deneyin.';status.className='cm-status err';
    }else{
      status.textContent='Yorum gönderilemedi. Lütfen tekrar deneyin.';status.className='cm-status err';
    }
  }catch(e){
    status.textContent='Sunucuya ulaşılamadı.';status.className='cm-status err';
  }finally{
    btn.disabled=false;
  }
}

/* SIMPLE MARKDOWN PARSER */
function mdToHtml(md){
  return md
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/^([A-Za-z_ÇĞİÖŞÜçğışöşü].+=.+)$/gm,'<div class="eq">$1</div>')
    .replace(/\n\n/g,'</p><p>')
    .replace(/^(?!<[h2h3d])/gm,'')
    .split('\n').map(l=>l.startsWith('<')?l:`<p>${l}</p>`).join('');
}
